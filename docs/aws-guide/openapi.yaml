  /hosts/egress/chain:
    get:
      operationId: fleetEgressChain
      summary: 只读:从单台 host 内核回读 OPENCLAW-EGRESS 链的真实证据
      description: |-
        不读 DDB,用一条只读 SSM 命令在指定 host 上回读 iptables,分三层报计数
        (FORWARD 的 per-tap 层、INPUT 的红线端口层、tap 设备数),并判定 `verdict`。

        判定分三种真实结论,刻意不合并:
        - `EFFECTIVE` —— 链在、有指向在役链的 FORWARD 跳转、指纹非空,且跳转前没有会改变
          guest 流量控制流的不安全规则。
        - `SHORT_CIRCUITED` —— 链齐备但跳转前有不安全规则(只豁免严格 RELATED,ESTABLISHED
          锚点与 DROP/REJECT/LOG),包可能进不了这条链;重新 apply 不一定能修。
        - `NOT_EFFECTIVE` —— 链/跳转/规则缺失。
        - `INCONCLUSIVE` —— **没读到**(实例离线、SSM 未达终态、输出被截断)。它与"链被拆了"
          是两件事,所以单独一种;此时响应只有 instance_id/source/read_at/verdict/error。

        读不到一律返回 **HTTP 200 + verdict=INCONCLUSIVE**,不返 5xx —— 5xx 与"链没装"
        在调用方看来不可区分,而这正是本接口要分开的两件事。内部轮询预算 18s,严格小于
        API Gateway 的 29s 窗口。
