      x-rbac: hmac
      parameters:
        - name: x-claw-authz-signature
          in: header
          required: true
          schema:
            type: string
          description: Hex HMAC-SHA256 of "{timestamp}.{raw_body}" keyed by the shared secret. The secret itself never transits the API.
          x-source: deploy/lambda/api/handler.py:534
          x-sensitive: true
        - name: x-claw-authz-timestamp
          in: header
          required: true
          schema:
            type: string
            description: Unix seconds as string; parsed with int().
          x-source: deploy/lambda/api/handler.py:539
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
              properties:
                tenant_id:
                  type: string
                tenant_user_id:
                  type: string
                  description: External user id; used when principal is absent. One of principal/tenant_user_id is required.
                principal:
                  type: string
                  description: Cognito sub the hub will match. Takes precedence over tenant_user_id.
                  x-source: deploy/lambda/api/handler.py:566
                op:
                  type: string
                  enum:
                    - grant
                    - revoke
                  default: grant
                  x-source: deploy/lambda/api/handler.py:569
                role:
                  type: string
                  default: member
                  description: Stored on the grant; free-form string, defaults to "member" (also when blank).
                  x-source: deploy/lambda/api/handler.py:590
                expire_at:
                  type: number
                  description: Optional unix-seconds expiry; stored (as int) only when numeric and > 0, otherwise silently ignored.
                  x-source: deploy/lambda/api/handler.py:592
      responses:
        '200':
          description: Grant/revoke persisted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: tenant_id echoed back.
