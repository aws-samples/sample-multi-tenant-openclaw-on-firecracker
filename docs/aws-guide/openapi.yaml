  /tenants/{id}/{action}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: tenantAction
      summary: 对租户执行生命周期/管理动作(start/stop/restart/resize…)
      description: |
        Dispatches on {action}. When the lifecycle SQS queue is enabled (LIFECYCLE_QUEUE_URL), start/stop/restart/pause/resume/reset/rebuild are enqueued and return 202 {status:queued}; otherwise they run synchronously via SSM and return 200 {id,status}. resize / resize-disk / migrate / backup / access / provision always keep their own synchronous semantics. Every action is owner/admin gated (403).
      x-source: deploy/lambda/api/services/tenant_service.py:1196
      x-rbac: operator
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - resize
              - resize-disk
              - migrate
              - restart
              - stop
              - start
              - reset
              - rebuild
              - pause
              - resume
              - backup
              - access
              - provision
          description: Unknown values return 400 {"error":"unknown action:..."}.
          x-source: deploy/lambda/api/services/tenant_service.py:1638
      requestBody:
        required: false
        content:
