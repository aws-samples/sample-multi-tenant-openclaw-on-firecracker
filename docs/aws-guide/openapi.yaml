  /hosts/egress:
    post:
      operationId: fleetEgressApply
      summary: 下发 guest 出网防火墙期望态(全机队或定向,最高爆炸半径)
      description: |-
        写 guest egress 期望态并 live-apply。期望态落 DDB(targets="all" 写 fleet 单例;
        定向写逐台 host 行),再用一条 SSM send_command 扇出 OPENCLAW-EGRESS 链的 apply/teardown。

        爆炸半径守卫(实现里的关键安全规则,改动前先读这两条):
        1. `targets` 只接受 `"all"` 或**非空字符串数组**。漏方括号的
           `{"targets":"i-0abc"}`、`null`、`{}`、`[]` 一律 400 —— 不按 truthiness 推
           "全机队",因为那会把一次定向意图变成对全部 host 的 teardown。
        2. `pinned=true` 与 `targets="all"` 互斥(400):把每台 host 都钉住会让后续全机队
           更新永久失效。

        期望态是**全量替换**而非增量:省略 `allow` 会把当前额外放行洞清空,响应用
        `extra_allow_cleared` 把这次删掉的洞显式列出来。`mode=off` 是 break-glass 单向
        语义 —— 它穿透 `egress_pinned`,且在 DDB 读/版本写失败时仍继续下发(其余路径 fail-closed
        返 503,期望态与内核均未改动,重试安全)。

        每次调用都先落一条命名版本(回滚锚点),再写期望态、再下发;记不下锚点就不下发。

        `allow[]` 的作用域下界由 `EGRESS_EXTRA_ALLOW_MIN_PREFIX` 决定(默认 /24，最宽 /16)。
        比默认更宽的洞会被放行，但响应体的 `extra_allow_scope` 会显式回报这次开了多宽
        (#668) —— 风险由调用方承担。想在下发前先看判定，用
        POST /hosts/egress/allow/validate(只读 dry-run)。
      x-source: deploy/lambda/api/services/egress_admin_service.py:1348
      x-rbac: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - deny
                    - 'off'
                  description: |-
                    必填。`deny` = 默认拒绝 + 白名单;`off` = 拆链(break-glass)。
                    大小写与首尾空格不敏感(strip().lower());非字符串或枚举外的值 400。
                  x-source: deploy/lambda/api/services/egress_admin_service.py:1365
                targets:
                  description: |-
                    `"all"`(默认)或非空 instance id 字符串数组。其余形状一律 400,见
                    description 里的爆炸半径守卫 1。
                  default: all
                  oneOf:
                    - type: string
                      enum:
                        - all
                    - type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                  x-source: deploy/lambda/api/services/egress_admin_service.py:1389
                deny_rfc1918:
                  type: boolean
                  default: false
                  description: 额外拒绝 guest 到 RFC1918 私网的出网。按 bool() 强转,非布尔值不报错。
                  x-source: deploy/lambda/api/services/egress_admin_service.py:1372
                pinned:
                  type: boolean
                  description: |-
                    提供时必须严格是 `true`/`false`(identity 校验,`"true"`/1 一律 400)。
                    `true` = 把这几台钉成"只听自己那行 host policy",后续 `targets="all"`
                    不再覆盖它们(`mode=off` 仍穿透);`false` = 批量摘掉 pin。
                    与 `targets="all"` 同时给 `true` → 400。省略 = 不动 pin 状态。
                  x-source: deploy/lambda/api/services/egress_admin_service.py:1370
                wait:
                  type: boolean
                  default: false
                  description: |-
                    `false`(默认)立即返 202 + command_id;`true` 在 API Gateway 的 29s 硬窗口内
                    轮询所有 host 到终态并返回逐机 apply_exit + rules_sha256。实测约 9 台起
                    `wait=true` 必 504,所以它只供小机队/验收取证。
                  x-source: deploy/lambda/api/services/egress_admin_service.py:1377
                allow:
                  type: array
                  description: |-
                    额外放行洞,**全量替换**语义(仅 `mode=deny` 有意义)。省略 = 清空当前洞
                    并在响应里报 extra_allow_cleared。LiteLLM 的洞由每台 host 从自己的
                    /etc/platform.env 派生,不经本字段。
                  items:
                    type: object
                    required:
                      - proto
                      - dport
                      - dst
                    properties:
                      proto:
                        type: string
                        enum:
                          - tcp
                          - udp
                      dport:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        description: |-
                          必须是 JSON 整数。字符串 `"443"` 与布尔值都 400(#631 修复后)。
                          红线端口(平台内部/数据存储端口)一律拒;8081 与其它非红线端口同
                          路,不再要求精确等于某个 SPIRE server /32(#660)。
                      dst:
                        type: string
                        description: |-
                          必填 IPv4 IP/CIDR。IPv6 拒(链是 IPv4-only);覆盖 IMDS
                          169.254.169.254 拒;前缀比 EGRESS_EXTRA_ALLOW_MIN_PREFIX 更宽拒 ——
                          该 env 默认 /24，可放宽到最宽 /16(#668)，也可收紧到 /32；写得比
                          /16 更宽会被绝对下界压回 /16;等于或包含 VPC_CIDR /
                          TENANT_SUPERNET 拒。
                        example: 10.20.30.0/24
                  x-source: deploy/lambda/api/services/egress_admin_service.py:169
                revision_name:
                  type: string
                  pattern: '^\s*$|^\s*[A-Za-z0-9._-]{1,48}\s*$'
                  description: |-
                    回滚锚点的名字。省略/空串/纯空白 = 自动取 `v<N>`(只按 `v<纯数字>` 递推,
                    运维自起的名字不参与编号)。给了名字则先 `strip()` 再判:1-48 字符、只含
                    `[A-Za-z0-9._-]`、不得以 `__` 开头(内部行保留前缀);重名 409。
                  x-source: deploy/lambda/api/services/egress_admin_service.py:667
      responses:
        '200':
          description: |-
            两种情形:①`wait=false` 且枚举出 0 台可下发 host(什么都没发);
            ②`wait=true` 且逐机全部 apply_exit=0 / ssm_status=Success / pin 检查可用,
            **且定向路径上每个目标都回收到了结果**。

            `targets=[...]` 定向时,窗口内没回来的目标会被列进 `missing_hosts` 并把整体压成
            207(#657) —— 调用方对自己给的那份 id 列表负责,所以少一台就不算成功。
            `targets="all"` 全量不做数量判定:期望集合是服务端 DDB 枚举出的快照(可能含已终止
            或 SSM 不受管的机器,也可能漏掉刚注册的新机),拿它当"应该回几台"会恒判失败。
            全量要对账就自己比 `expected_host_count` 与 `host_count`,或用 GET /hosts/egress
            的收敛报告。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FleetEgressNoHosts'
                  - $ref: '#/components/schemas/FleetEgressWaitResult'
              x-source: deploy/lambda/api/services/egress_admin_service.py:1490
        '202':
          description: '`wait=false`:期望态已写、SSM 已下发,收敛由 host-agent 上报(轮询 GET /hosts/egress)。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetEgressDispatched'
              x-source: deploy/lambda/api/services/egress_admin_service.py:1550
        '207':
          description: |-
            `wait=true` 且出现下列任一情形:至少一台 apply_exit≠0 / ssm_status≠Success /
            pin 检查不可用;或定向路径(`targets=[...]`)上有目标在窗口内没回收到 invocation
            (`collection_incomplete=true`,缺哪几台见 `missing_hosts`,#657)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetEgressWaitResult'
              x-source: deploy/lambda/api/services/egress_admin_service.py:1611
        '400':
          description: |-
            入参校验失败。判据(逐条实测):
            `mode` 缺失/非字符串/枚举外;`pinned` 提供但非布尔;`targets` 不是 `"all"` 也
            不是非空字符串数组(裸字符串 / dict / null / [] / 含空串的数组);
            `pinned=true` 与 `targets="all"` 并用;`allow` 非数组或某项非对象;
            `allow[i].proto` 非 tcp|udp;`allow[i].dport` 非整数或越界或命中红线端口
            (8081 不在红线内,#660 起走通用护栏);`allow[i].dst` 缺失 / 非 IP-CIDR / 非 IPv4 / 覆盖 IMDS /
            前缀过宽(下界 = env，绝对下界 /16) / 等于或包含 VPC_CIDR 与 TENANT_SUPERNET;
            `revision_name` 超 48 字符 /
            含非 `[A-Za-z0-9._-]` 字符 / 以 `__` 开头。`revision_name` 空串**不是** 400 ——
            它与省略同义,走自动取名(`egress_admin_service.py:779`)。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: targets must be "all" or a non-empty list of instance id strings
                  got:
                    type: string
                    description: 仅 targets 形状错误时返回 —— 收到的原始值(截断 64 字符)或其类型名。
                  next_auto_name:
                    type: string
                    description: 仅 revision_name 非法时返回,给出当前可用的自动名。
                x-source: deploy/lambda/api/services/egress_admin_service.py:1388
        '403':
          description: 调用者身份不是 admin(handler 内 identity 门),或前置 RBAC 路由门按 role 拒绝。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'forbidden: fleet egress admin requires admin'
                  required:
                    type: string
                    enum:
                      - admin
                x-source: deploy/lambda/api/services/egress_admin_service.py:1360
        '409':
          description: 显式给的 revision_name 已存在。版本名是回滚的唯一坐标,不允许覆写历史。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'revision name already exists: v3'
                  hint:
                    type: string
                  next_auto_name:
                    type: string
                x-source: deploy/lambda/api/services/egress_admin_service.py:787
        '502':
          description: |-
            SSM send_command 抛错。期望态**已经写了**,而这一跳的下发结果**未知** —— 异常可能
            发生在 AWS 已受理命令之后(`egress_admin_service.py:1343` 是裸 except,拿不到
            command id 也就无从判别)。别把它当"内核没动"直接重试:先用 GET /hosts/egress
            看收敛、必要时 GET /hosts/egress/chain 回读内核,再决定重发。
            重发本身是安全的(apply 幂等),但会多落一条回滚锚点。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'failed to dispatch fleet-egress: ...'
                x-source: deploy/lambda/api/services/egress_admin_service.py:1593
        '503':
          description: |-
            fail-closed:改动前的期望态读不到、版本列举失败或版本写入失败 —— 记不下可信的
            回滚点就不下发。期望态与内核均未改动,重试是安全的。`mode=off` 这条 break-glass
            不走本分支(它继续下发,并把读不到的机器记成 source=unknown)。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type: string
                x-source: deploy/lambda/api/services/egress_admin_service.py:1457
