                    role:
                      type: string
                      default: member
                      description: Grant only.
                    expire_at:
                      type: integer
                      description: Optional epoch seconds (> 0).
                - title: lifecycle-or-empty
                  type: object
                  description: restart/stop/start/reset/rebuild/pause/resume/backup/provision take no body fields.
      responses:
        '200':
          description: |
            Synchronous action result. Lifecycle actions: {id,status} (running/ stopped/paused). resize: {id,vcpu,mem_mb,delta}. resize-disk: {id,status,old_size_mb,new_size_mb}. access: {id,authorized_users}. provision: {id,purchase_status,provisioned|message} (idempotent when already provisioned).
