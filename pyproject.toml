[project]
name = "sample-multi-tenant-openclaw-on-firecracker"
version = "1.5.5"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.251.0",
    "aws-cdk.aws-bedrock-agentcore-alpha==2.251.0a0",
    "constructs>=10.0.0",
    "pyyaml>=6.0",
    # boto3 is a DEPLOY-TIME dependency, not only a test one. setup.sh runs
    # scripts/deploy-cdk.sh, whose GSI-rollout preflight imports boto3 to read the
    # live table state before cdk deploy. It runs unconditionally, so leaving boto3
    # in the test group only (which `uv sync` does not install by default) makes the
    # preflight exit 2 and one-click setup stop before CDK ever starts.
    "boto3>=1.34.0",
]

[dependency-groups]
# 1.5.0: pyjwt + cryptography let the offline RBAC tests import the same
# JWT verification path the Lambda uses (sign a test RS256 token, assert the
# handler verifies/rejects it). The Lambda gets these via CDK bundling
# (deploy/lambda/api/requirements.txt), not from this group.
test = ["pytest", "moto", "boto3", "hypothesis", "jsonschema>=4.23.0", "pyjwt>=2.8.0", "cryptography>=42.0.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (mock AWS, fast)",
    "e2e: End-to-end tests (real AWS resources, slow)",
    "regression: Regression tests (verify existing features)",
]
