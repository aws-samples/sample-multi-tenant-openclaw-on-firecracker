  /batch/tenants:
    post:
      operationId: batchTenants
      summary: 批量对多个租户执行一个生命周期动作
      description: |
        Applies one action (start/stop/delete/backup) to a set of tenants given either an explicit `ids` list or a `filter`. Small batches (<=100 ids) run synchronously; larger batches or an explicit `async: true` are recorded as an async job executed by a self-invoked worker (202 + job_id). For non-admin callers the `filter` path resolves only tenants owned by the caller (issue #80); platform-scoped API keys are confined to their own platform namespace (#108). Requires API Gateway x-api-key.
