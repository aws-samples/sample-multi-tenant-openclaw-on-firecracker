  # ══ batch-users ══
  /batch/tenants:
    post:
      operationId: batchTenants
      summary: Apply one lifecycle action to many tenants in a single call
      description: >
        Applies one action (start/stop/delete/backup) to a set of tenants given either
        an explicit `ids` list or a `filter`. Small batches (<=100 ids) run synchronously;
        larger batches or an explicit `async: true` are recorded as an async job executed
        by a self-invoked worker (202 + job_id). For non-admin callers the `filter` path
        resolves only tenants owned by the caller (issue #80); platform-scoped API keys
        are confined to their own platform namespace (#108). Requires API Gateway x-api-key.
      x-source: "deploy/lambda/api/handler.py:1253"
      x-rbac: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [backup, delete, start, stop]
                  description: Lifecycle action applied to every target tenant.
                  x-source: "deploy/lambda/api/handler.py:1248"
                ids:
                  type: array
                  items:
                    type: string
                  maxItems: 100000
                  description: >
                    Explicit tenant id list. Mutually exclusive with `filter` (exactly one
                    of the two must be present, else 400). Lists larger than 100 route to
                    the async job path; the hard per-request cap is 100000.
                  x-source: "deploy/lambda/api/handler.py:1263-1278"
                filter:
                  type: object
                  description: >
                    Server-side target resolution. The only supported key is `tag` with a
                    "key:value" string; a tag value without a colon matches nothing. Unknown
                    keys are rejected with 400. Non-admin callers only match tenants they own.
                  properties:
                    tag:
                      type: string
                      description: Tag filter in "key:value" form.
                      x-source: "deploy/lambda/api/services/fleet_service.py:460-465"
                  additionalProperties: false
                  x-source: "deploy/lambda/api/handler.py:1249,1280-1287"
                async:
                  type: boolean
                  default: false
                  description: >
                    Force the async job path even for small batches. Implicitly true when
                    ids/filter resolve to more than 100 targets.
                  x-source: "deploy/lambda/api/handler.py:1294"
      responses:
        "200":
          description: Synchronous batch executed (<=100 targets, no async).
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        action: { type: string }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        error: { type: string }
                x-source: "deploy/lambda/api/handler.py:1311-1312, deploy/lambda/api/services/fleet_service.py:277-304"
        "202":
          description: Async job accepted (async:true or >100 targets, ledger deployed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: Poll GET /batch/jobs/{job_id} for progress.
                  status:
                    type: string
                    enum: [queued]
                  total:
                    type: integer
                x-source: "deploy/lambda/api/services/fleet_service.py:367"
        "400":
          description: >
            Validation failure. Cases: missing body; action not in
            [backup, delete, start, stop]; both or neither of ids/filter; ids not an
            array; more than 100000 ids; unknown filter key; >100 ids on the sync path
            without async:true. Body is {"error": "<message>"} (no `code` field on this route).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                x-source: "deploy/lambda/api/handler.py:1255-1310"
        "403":
          description: RBAC role below operator (when RBAC_ENABLED).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: forbidden }
                  rbac:
                    type: object
                    properties:
                      role: { type: string }
                      required: { type: string }
                x-source: "deploy/lambda/api/core/auth.py:592-608"
        "500":
          description: >
            Async worker dispatch failed (job recorded as dispatch_failed; body includes
            job_id) or unhandled exception (body {"error": "<exception text>"}).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  job_id: { type: string }
                x-source: "deploy/lambda/api/services/fleet_service.py:357-366, deploy/lambda/api/handler.py:288-292"
        "503":
          description: >
            Async required (>100 ids) but the async job ledger is not deployed
            (BATCH_JOBS_TABLE env absent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "async batch not configured (BATCH_JOBS_TABLE absent)"
                x-source: "deploy/lambda/api/handler.py:1296-1303"

