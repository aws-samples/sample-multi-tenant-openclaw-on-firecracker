    get:
      operationId: pullImageProgress
      summary: 查询单台宿主机 pull-image 进度(SageMaker ProcessingJob 风格)
      description: >-
        #309/#333 — Poll the progress of a pull-image job on ONE host. Reads the host's pull_command_id
        from DDB, then SSM-tails /tmp/<job_id>.txt on the host: the last line decides the tri-state, and
        the most recent ERROR:<CODE> line becomes the failure detail. Returns SageMaker ProcessingJob-style
        JSON. If a terminal error was persisted to DDB (last_pull_error) but the progress file can't be
        read (worker exited early), the status is forced to Failed so the host never appears stuck
        InProgress. No pull job → state=NONE, ProcessingJobStatus=null, snapshot_time=null.
      x-source: deploy/lambda/api/services/host_service.py:1441
      x-rbac: viewer
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: job_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            #394 — exact pull-job lookup. New clients SHOULD always pass it. Unknown job_id or a
            job that belongs to a different host → 404 JOB_NOT_FOUND (never silently falls back
            to "this host''s latest"). Absent (compat window) → the host''s most recent job, else
            the legacy host.pull_command_id path. When the persisted job is already terminal, the
            response is answered from the job record without SSM (survives host /tmp loss).
            Adds state/phase/target_slot/requested_snapshot_time/result/error alongside the
            legacy ProcessingJobStatus tri-state.
