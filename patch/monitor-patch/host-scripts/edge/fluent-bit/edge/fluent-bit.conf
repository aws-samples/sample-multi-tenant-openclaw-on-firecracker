# deploy/edge/fluent-bit/fluent-bit.conf — edge log shipper.
#
# Pipeline: journald (claw_edge tag) → parse JSON → extract trace_root →
# inject instance metadata → Kinesis Data Firehose.
#
# Deployed by install-edge.sh to /etc/fluent-bit/fluent-bit.conf.
# Design reference: .kiro/specs/platform-observability/design.md §5.
#
# Config-gated: install-edge.sh skips Fluent Bit entirely when
# LOGGING_ENABLED=false (default: true).

[SERVICE]
    Flush               5
    Grace               30
    Daemon              Off
    Log_Level           info
    Parsers_File        parsers.conf
    HTTP_Server         On
    HTTP_Listen         0.0.0.0
    HTTP_Port           2020
    Health_Check        On
    HC_Errors_Count     5
    HC_Retry_Failure_Count 5
    HC_Period           60
    storage.path        /var/lib/fluent-bit/storage
    storage.sync        normal
    storage.checksum    off
    storage.metrics     on

[INPUT]
    Name                systemd
    Tag                 edge.access
    Systemd_Filter      SYSLOG_IDENTIFIER=claw_edge
    DB                  /var/lib/fluent-bit/journal-edge.db
    Read_From_Tail      On
    Strip_Underscores   Off
    storage.type        filesystem
    Mem_Buf_Limit       30M

[FILTER]
    Name                parser
    Match               edge.access
    Key_Name            MESSAGE
    Parser              json
    Reserve_Data        Off

[FILTER]
    Name                lua
    Match               edge.access
    script              /etc/fluent-bit/extract_trace_root.lua
    call                extract_trace_root

[FILTER]
    Name                aws
    Match               edge.access
    imds_version        v2
    az                  true
    ec2_instance_id     true

[OUTPUT]
    Name                kinesis_firehose
    Match               edge.access
    region              ${FB_REGION}
    delivery_stream     ${FB_STREAM}
    auto_retry_requests true
    Retry_Limit         False
    storage.total_limit_size 2G
