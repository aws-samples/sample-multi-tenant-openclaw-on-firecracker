openapi: 3.1.0
info:
  title: OpenClaw on Firecracker — 控制面 API(ClawPool 多租户平台)
  version: 1.5.5
  description: |-
    ClawPool 控制面 REST API(API Gateway + Lambda):租户 microVM 生命周期、宿主机/舰队、
    技能/分组/模板、联邦与外部授权;外加反向代理在 /hub/* 下的数据面 hub 接口。

    ## 在本页怎么试跑
    本页默认走**同域只读代理**(`/api/cp-proxy`):后端代持 x-api-key,浏览器**零输入**即可对 GET 接口
    点 Try it out 看真实返回;写操作(POST/PUT/DELETE)代理返回 405(公开页不做无鉴权写)。
    要真跑写操作或连自己的部署 → 用页面上方「高级」填 ApiUrl + x-api-key。

    ## 鉴权模型(直连真实控制面时)
    1. **API key**(`x-api-key` 头)—— 每个控制面调用都过 API Gateway usage-plan;缺/错 → 403。
    2. **Cognito JWT**(`Authorization: Bearer <id_token>`)—— 用户身份路由(如 `POST /tenants/self`),Lambda 内 JWKS RS256 验签。
    3. **RBAC + owner 门控** —— 角色 viewer < operator < admin(来自 cognito:groups);按租户的路由额外校验 owner==调用者(或 admin / api-key)。

    错误信封:较新的校验路径返回 `{"error","code"}`(code ∈ VALIDATION/CONFLICT/FORBIDDEN…);旧路径返回 `{"error"}`。
servers:
  - url: /api/cp-proxy
    description: 本页默认同域只读代理(后端代持 x-api-key,GET 零输入试跑;写操作 405)。直连真实控制面/跑写操作请用页面「高级」填 ApiUrl + x-api-key。
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: API Gateway usage-plan key. Required on every control-plane call.
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito id_token (RS256, JWKS-verified in Lambda).
  schemas:
    TenantRecord:
      type: object
      description: |
        A tenant record as returned by GET /tenants and GET /tenants/{id}. Secret fields (channel_secret, litellm_vkey, cognito_channel_password, gateway_token) are ALWAYS stripped by _redact_tenant before response. Numeric fields (vcpu/mem_mb/vm_num) are STRING-typed (DynamoDB N-as-S). Field set verified against a live ap-southeast-1 response (2026-07-07).
      x-source: deploy/lambda/api/services/tenant_service.py:84 (_TENANT_SECRET_FIELDS redaction)
      properties:
        id:
          type: string
          description: Tenant id (name-hash or deterministic from client_token).
        name:
          type: string
        status:
          type: string
          description: creating | pending | queued | running | stopped | deleted | requires_intervention
        desired_status:
          type: string
          description: Reconciliation target status.
        owner_id:
          type: string
          description: Cognito sub or API_KEY_OWNER.
        tenant_user_id:
          type:
            - string
            - 'null'
          description: External-federation stable user id (from JWT custom claim).
        uuid:
          type: string
        vcpu:
          type: string
          description: String-typed integer.
        mem_mb:
          type: string
          description: String-typed integer.
        vm_num:
          type:
            - string
            - 'null'
          description: Per-host VM slot number.
        host_id:
          type:
            - string
            - 'null'
          description: Instance id of the placing host; null while queued/pending.
        host_port:
          type:
            - string
            - 'null'
        guest_ip:
          type:
            - string
            - 'null'
        image_id:
          type: string
        config_template:
          type:
            - string
            - 'null'
        tags:
          type: object
          additionalProperties:
            type: string
        vm_health:
          type:
            - string
            - 'null'
          description: up | down | unknown
        app_health:
          type:
            - string
            - 'null'
        health_failures:
          type:
            - string
            - integer
            - 'null'
        last_health_check:
          type:
            - string
            - 'null'
        metrics:
          type:
            - object
            - 'null'
        created_at:
          type:
            - string
            - 'null'
        creation_started_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
        last_backup_at:
          type:
            - string
            - 'null'
        restore_backup_key:
          type:
            - string
            - 'null'
        dispatch_claim:
          type:
            - string
            - 'null'
          description: Dispatch consumer claim token (internal).
        dispatch_claim_ts:
          type:
            - string
            - 'null'
        dispatch_retries:
          type:
            - string
            - integer
            - 'null'
    HostRecord:
      type: object
      description: |
        A Firecracker host record from GET /hosts. Capacity numbers are STRING-typed. Field set verified against a live ap-southeast-1 response (2026-07-07).
      x-source: deploy/lambda/api/services/host_service.py:26
      properties:
        instance_id:
          type: string
        status:
          type: string
          description: active | draining
        az:
          type: string
        private_ip:
          type: string
        total_vcpu:
          type: string
        used_vcpu:
          type: string
        total_mem_mb:
          type: string
        used_mem_mb:
          type: string
        vm_count:
          type: string
        next_vm_num:
          type: string
        rootfs_version:
          type: string
        cpu_overcommit_ratio:
          type:
            - string
            - number
        mem_overcommit_ratio:
          type:
            - string
            - number
        idle_since:
          type:
            - string
            - 'null'
        last_seen:
          type:
            - string
            - 'null'
        last_health_check:
          type:
            - string
            - 'null'
security:
  - apiKey: []
paths:
  /tenants:
    get:
      operationId: listTenants
      summary: 列出租户
      description: |
        Returns non-deleted tenants. Without ?limit / ?next_token the response is a BARE ARRAY (legacy shape); with either param it is a paginated object. Rows lacking a status or host_id (half-written / queued placeholders) are filtered out. Non-admin Cognito callers see only tenants they own; a platform-scoped API key sees only its own platform's tenants.
      x-source: deploy/lambda/api/handler.py:306
      x-rbac: viewer
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Page size 1-1000 (values above 1000 are clamped). Present-but-malformed (non-integer, <1) is a 400 VALIDATION. Absent = legacy bare-array scan.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          x-source: deploy/lambda/api/core/utils.py:306
        - name: next_token
          in: query
          required: false
          description: Opaque pagination cursor from a previous page. Tampered/garbage tokens are a 400 VALIDATION, not a silent first-page reset.
          schema:
            type: string
          x-source: deploy/lambda/api/core/utils.py:329
        - name: tag
          in: query
          required: false
          description: Filter by tag, format key:value. Repeatable; multiple occurrences AND together. Malformed values (no colon) match nothing.
          schema:
            type: string
          style: form
          explode: true
          x-source: deploy/lambda/api/core/utils.py:168
        - name: platform_id
          in: query
          required: false
          description: Exact-match filter on the external-platform attribution field.
          schema:
            type: string
            pattern: ^[a-zA-Z0-9._-]{1,128}$
          x-source: deploy/lambda/api/handler.py:379
        - name: purchase_status
          in: query
          required: false
          description: Filter by purchase stage.
          schema:
            type: string
            enum:
              - pending
              - provisioned
          x-source: deploy/lambda/api/handler.py:385
      responses:
        '200':
          description: |
            Bare array of tenant records (no pagination params), or {tenants, next_token, count} when paginating. Secret fields (channel_secret, litellm_vkey, cognito_channel_password, gateway_token) are stripped from every record.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    description: Legacy shape (no ?limit / ?next_token).
                    items:
                      $ref: '#/components/schemas/TenantRecord'
                  - type: object
                    description: Paginated shape.
                    properties:
                      tenants:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantRecord'
                      next_token:
                        type:
                          - string
                          - 'null'
                        description: Cursor for the next page; null when exhausted.
                      count:
                        type: integer
          x-source: deploy/lambda/api/handler.py:400
        '400':
          description: Bad limit / next_token / platform_id / purchase_status filter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - VALIDATION
      tags:
        - 租户生命周期
    post:
      operationId: createTenant
      summary: 创建租户(operator/API-key 路径)
      description: |
        Creates a tenant microVM. Three return modes: 201 synchronous (status creating, or pending when no host has capacity and a scale-out is triggered); 202 queued when either the SQS dispatch queue (DISPATCH_QUEUE_URL) or create-via-queue FIFO (CREATE_VIA_QUEUE) is enabled. With a client_token the tenant id is deterministic (t-<hash(owner,token)>) so a retried POST returns 409 CONFLICT instead of opening a second VM.
      x-source: deploy/lambda/api/services/tenant_service.py:218
      x-rbac: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 32
                  pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
                  description: Lowercase DNS-label; drives the tenant id.
                  x-source: deploy/lambda/api/core/utils.py:128
                vcpu:
                  type: integer
                  minimum: 1
                  default: 2
                  description: Positive integer. Default from env VM_DEFAULT_VCPU (2). Subject to optional quota (QUOTAS_ENABLED).
                  x-source: deploy/lambda/api/services/tenant_service.py:307
                mem_mb:
                  type: integer
                  minimum: 1
                  default: 4096
                  description: Positive integer MB. Default from env VM_DEFAULT_MEM (4096).
                  x-source: deploy/lambda/api/services/tenant_service.py:310
                data_disk_mb:
                  type: integer
                  minimum: 1
                  default: 2048
                  description: |
                    Positive integer MB, validated and quota-checked at create, but NOT persisted on the record nor passed to launch-vm by any create path (code gap; the effective disk size is the image default until a resize-disk action writes data_disk_mb).
                  x-source: deploy/lambda/api/services/tenant_service.py:313
                image_id:
                  type: string
                  default: v2
                  pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
                  description: Golden rootfs version recorded at creation.
                  x-source: deploy/lambda/api/services/tenant_service.py:344
                config_template:
                  type: string
                  pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
                  description: S3 template slug (DNS-label only; flows into an SSM shell command, injection rejected at the edge). Empty = no custom template.
                  x-source: deploy/lambda/api/services/tenant_service.py:322
                security:
                  type: object
                  description: Optional per-tenant encryption/cert config. Invariants enforced; absent behaves exactly as before the field existed.
                  x-source: deploy/lambda/api/core/utils.py:50
                  properties:
                    storage_encrypted:
                      type: boolean
                      default: false
                    encryption_type:
                      type: string
                      enum:
                        - none
                        - platform_managed
                        - tenant_cmk
                      description: Defaults to none when storage_encrypted=false, platform_managed when true. tenant_cmk requires kms_key_arn.
                    kms_key_arn:
                      type: string
                      description: Full ARN required. Rejected if storage_encrypted=false.
                    cert_arn:
                      type: string
                      description: Full ARN required.
                    secret_ref:
                      type: string
                      description: Full ARN required.
                client_token:
                  type: string
                  minLength: 4
                  maxLength: 128
                  pattern: ^[\x21-\x7e]{4,128}$
                  description: Optional idempotency key (printable ASCII 33-126, no spaces/control chars). Same owner+token yields the same tenant id; replay returns 409.
                  x-source: deploy/lambda/api/services/tenant_service.py:354
                chat_endpoint_enabled:
                  type: boolean
                  default: false
                  description: |
                    Per-tenant OpenAI-compatible chatCompletions switch. Must be a real JSON boolean; strings/numbers are a 400 (secure default off). KNOWN BUG (#160): when the SQS dispatch queue is enabled, the enqueue path reads body.chat_ep (not chat_endpoint_enabled) so this flag is silently dropped on the queued path — effective only on the synchronous path until #160 lands.
                  x-source: deploy/lambda/api/services/tenant_service.py:384
                  x-known-bug: 160
                skills:
                  type: array
                  items:
                    type: string
                  description: Per-tenant skill scope; deduplicated, sorted, blanks dropped. Absent = broadcast all skills.
                  x-source: deploy/lambda/api/services/tenant_service.py:369
                group:
                  type: string
                  pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
                  description: Optional group membership; the group must already exist (404 otherwise).
                  x-source: deploy/lambda/api/services/tenant_service.py:393
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  maxProperties: 20
                  description: String map. Keys <=50 chars, values <=100 chars, ':' forbidden in both (reserved for query syntax).
                  x-source: deploy/lambda/api/core/utils.py:144
                ttl_hours:
                  type: integer
                  minimum: 1
                  maximum: 8760
                  description: Optional TTL (max 1 year). Computes expires_at server-side.
                  x-source: deploy/lambda/api/core/utils.py:203
                on_expiry:
                  type: string
                  enum:
                    - stop
                    - delete
                  default: stop
                  description: Requires ttl_hours.
                  x-source: deploy/lambda/api/core/utils.py:223
                schedule:
                  type: object
                  description: Optional start/stop schedule.
                  x-source: deploy/lambda/api/core/utils.py:242
                  required:
                    - start
                    - stop
                  properties:
                    start:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                      description: HH:MM, strictly parsed.
                    stop:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                      description: HH:MM, must differ from start.
                    timezone:
                      type: string
                      default: UTC
                      description: IANA zone name.
                    days:
                      type: array
                      items:
                        type: string
                        enum:
                          - Mon
                          - Tue
                          - Wed
                          - Thu
                          - Fri
                          - Sat
                          - Sun
                      description: Defaults to all seven days.
                restore_from:
                  type: object
                  description: Seed the new tenant from an existing backup. Mutually exclusive with clone_from.
                  x-source: deploy/lambda/api/services/tenant_service.py:455
                  required:
                    - tenant_id
                  properties:
                    tenant_id:
                      type: string
                      description: Source tenant id.
                    timestamp:
                      type: string
                      description: Exact backup timestamp; absent = most recent backup.
                clone_from:
                  type: string
                  description: Clone a RUNNING tenant you own (forces same-host scheduling). Mutually exclusive with restore_from.
                  x-source: deploy/lambda/api/services/tenant_service.py:413
                preferred_host_id:
                  type: string
                  description: Pin scheduling to a specific host (404 if missing/draining, 400 if it lacks capacity).
                  x-source: deploy/lambda/api/services/tenant_service.py:638
                platform_id:
                  type: string
                  pattern: ^[a-zA-Z0-9._-]{1,128}$
                  description: External-platform attribution. A platform-scoped API key may only name its own platform (403 otherwise).
                  x-source: deploy/lambda/api/services/tenant_service.py:252
                owner_id:
                  type: string
                  format: uuid
                  description: Create-on-behalf attribution override. API-key callers ONLY; Bearer callers get 403. Must be a Cognito sub UUID. Refused (403) when EXTERNAL_AUTHZ is on.
                  x-source: deploy/lambda/api/services/tenant_service.py:139
                tenant_user_id:
                  type: string
                  pattern: ^[\x21-\x7e]{1,128}$
                  description: External platform's own stable user id (not a Cognito sub). API-key callers only (403 for Bearer).
                  x-source: deploy/lambda/api/services/tenant_service.py:201
                order_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[\x21-\x7e]{1,128}$
                  description: External order id (billing anchor). Any purchase field present marks the record purchase_status=pending.
                  x-source: deploy/lambda/api/services/tenant_service.py:103
                plan_tier:
                  type: string
                  enum:
                    - free
                    - standard
                    - pro
                    - enterprise
                  x-source: deploy/lambda/api/services/tenant_service.py:111
                purchase_status:
                  type: string
                  enum:
                    - pending
                  description: On create only omitted or explicit 'pending' is accepted; 'provisioned' is rejected (use POST /tenants/{id}/provision).
                  x-source: deploy/lambda/api/services/tenant_service.py:116
      responses:
        '201':
          description: |
            Synchronous create. status=creating with placement fields when a host was reserved; status=pending (id/status/message only) when no capacity exists and a scale-out was triggered.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Host reserved, VM launching.
                    properties:
                      id:
                        type: string
                      host_id:
                        type: string
                      guest_ip:
                        type: string
                      host_port:
                        type: integer
                      status:
                        type: string
                        enum:
                          - creating
                    x-source: deploy/lambda/api/services/tenant_service.py:985
                  - type: object
                    description: No capacity; saved as pending, scaling out.
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum:
                          - pending
                      message:
                        type: string
                    x-source: deploy/lambda/api/services/tenant_service.py:745
        '202':
          description: Accepted onto the dispatch queue (DISPATCH_QUEUE_URL) or create-via-queue FIFO; poll GET /tenants/{id}.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - queued
                  message:
                    type: string
          x-source: deploy/lambda/api/services/tenant_service.py:556
        '400':
          description: |
            Validation failure (name/vcpu/mem_mb/data_disk_mb/config_template/ image_id/security/client_token/chat_endpoint_enabled/skills/group/ tags/ttl/schedule/purchase fields/platform_id/owner_id/tenant_user_id, clone+restore mutual exclusion, clone source not running, quota exceeded, preferred host lacks capacity). Newer validators include code=VALIDATION; older paths return {error} only.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - VALIDATION
        '403':
          description: owner_id/tenant_user_id override on a Bearer call; owner_id under EXTERNAL_AUTHZ; platform-scoped key naming another platform; not owner of clone source.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - FORBIDDEN
          x-source: deploy/lambda/api/services/tenant_service.py:269
        '404':
          description: Referenced group / clone source / restore backup / preferred host not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: |
            Tenant id already exists (client_token replay or duplicate consume) or clone slot contention. Sync path returns code=CONFLICT + id (tenant_service.py:728); the dispatch placeholder path returns {error, id} without a code field (tenant_service.py:525).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - CONFLICT
                  id:
                    type: string
        '502':
          description: clone-data.sh failed on host, or launch-vm SSM dispatch failed (throttled); tenant rolled back, safe to retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  id:
                    type: string
          x-source: deploy/lambda/api/services/tenant_service.py:960
        '503':
          description: Dispatch enqueue failed, or host slot allocation contended out after retries; retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          x-source: deploy/lambda/api/services/tenant_service.py:820
      tags:
        - 租户生命周期
  /tenants/self:
    post:
      operationId: createTenantSelf
      summary: 已登录用户自助开通节点
      description: |
        Any VERIFIED Cognito user provisions their OWN node. owner_id is forced to the caller's verified sub; owner/owner_id/tenant_user_id in the body are stripped. A per-user cap (env SELF_MAX_NODES_PER_USER, default 1; 0 = unlimited) is enforced via the gsi_owner index (fail-closed on count errors). Delegates to create_tenant, so create's full body schema and 201/202/4xx responses apply.
      x-source: deploy/lambda/api/handler.py:459
      x-rbac: viewer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Same schema as POST /tenants minus owner_id/owner/tenant_user_id (stripped). name defaults to u-<sub-prefix> when omitted.
      responses:
        '201':
          description: Created (same shapes as POST /tenants 201).
        '202':
          description: Queued (same shape as POST /tenants 202).
        '401':
          description: No verified Cognito user (API-key path or unverified token).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          x-source: deploy/lambda/api/handler.py:474
        '403':
          description: Self-service disabled because tenant authority is external (EXTERNAL_AUTHZ on).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          x-source: deploy/lambda/api/handler.py:479
        '409':
          description: Per-user node limit reached (n/SELF_MAX_NODES_PER_USER).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          x-source: deploy/lambda/api/handler.py:487
      tags:
        - 租户生命周期
  /tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Tenant id (name-xxxx, or t-<hash16> for client_token creates).
    get:
      operationId: getTenant
      summary: 查询单个租户
      description: |
        Returns the tenant DDB record plus computed effective_skills ("*" = broadcast all, or the resolved list). Owner/admin/API-key only (IDOR guard). Secret fields are stripped server-side.
      x-source: deploy/lambda/api/handler.py:407
      x-rbac: viewer
      responses:
        '200':
          description: Tenant record (secrets redacted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    description: Lifecycle state (pending/creating/running/stopped/paused/migrating/deleting/deleted).
                  host_id:
                    type: string
                  vm_num:
                    type: integer
                  guest_ip:
                    type: string
                  host_port:
                    type: integer
                  vcpu:
                    type: integer
                  mem_mb:
                    type: integer
                  image_id:
                    type: string
                  rootfs_version:
                    type: string
                  config_template:
                    type: string
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                  effective_skills:
                    description: '"*" (broadcast all) or the resolved skill list.'
                    oneOf:
                      - type: string
                        const: '*'
                      - type: array
                        items:
