                  s3_uri:
                    type: string
                  ProcessingJobStatus:
                    type: string
                    enum:
                      - Completed
                  ExitCode:
                    type: integer
                    enum:
                      - 0
              x-source: deploy/lambda/api/services/host_service.py:1421
              example:
