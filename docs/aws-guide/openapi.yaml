      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - scope
                - action
                - client_token
              properties:
                scope:
                  description: |
                    "fleet", {"host_id":"i-..."}, or
                    {"tenant_ids":["tenant-a","tenant-b"]}.
                  oneOf:
                    - type: string
                      enum: [fleet]
                    - type: object
                      additionalProperties: false
                      required: [host_id]
                      properties:
                        host_id:
                          type: string
                          minLength: 1
                    - type: object
                      additionalProperties: false
                      required: [tenant_ids]
                      properties:
                        tenant_ids:
                          type: array
                          minItems: 1
                          maxItems: 2000
                          uniqueItems: true
                          items:
                            type: string
                            minLength: 1
                action:
                  type: string
                  enum: [restart, rebuild]
                  description: |
                    restart preserves overlay.ext4 and is only suitable for
                    immutable identity-disk adoption when rootfs is already at
                    the target; use rebuild for rootfs adoption. rebuild retains
                    its existing admin-only admission and forced backup.
                batch_size:
                  type: integer
                  minimum: 1
                  maximum: 25
                  default: 1
                max_batch_failures:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Must be less than batch_size.
                target_version:
                  type: string
                  description: Optional precondition requiring every selected host live rootfs label to match.
                client_token:
                  type: string
                  minLength: 4
                  maxLength: 128
                  pattern: '^[!-~]{4,128}$'
                  description: Required idempotency token scoped to caller identity/platform.
