        '400':
          description: Missing instance_id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - VALIDATION
        '403':
          description: RBAC denied (viewer+ required when RBAC_ENABLED).
        '404':
          description: >-
            Host instance_id not found (code NOT_FOUND), or a job_id was given but is unknown /
