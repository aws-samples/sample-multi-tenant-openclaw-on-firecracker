  # ══ hub-dataplane ══
  # ── Hub data plane ──────────────────────────────────────────────────────────
  # Served by the hub Node server (deploy/hub/server.mjs → lib/http-routes.mjs).
  # External path is /hub/* (CloudFront behavior → EKS ALB or metal nginx); the
  # leading /hub prefix is stripped inside the hub so both links match the same
  # routes (deploy/hub/lib/http-routes.mjs:30-33).
  # CORS: every response carries Access-Control-Allow-Origin:*, Allow-Headers
  # Content-Type,Authorization,x-api-key, Allow-Methods POST,OPTIONS; OPTIONS
  # preflight returns 204 (deploy/hub/lib/http-routes.mjs:35-44).
  # NOTE error shape: hub errors are {"error": "<human msg>"} WITHOUT the control
  # plane's "code" enum field (verified per-branch in http-routes.mjs).

  /hub/healthz:
    get:
      operationId: hubHealthz
      summary: Hub liveness probe
      description: Plain-text liveness check. No authentication.
      x-source: "deploy/hub/lib/http-routes.mjs:45-49"
      x-rbac: none
      responses:
        "200":
          description: Hub process is up.
          content:
            text/plain:
              schema:
                type: string
                const: "ok"
                x-source: "deploy/hub/lib/http-routes.mjs:46-47"

  /hub/token:
    post:
      operationId: hubIssueFrontendToken
      summary: Mint a short-lived frontend hub token
      description: >-
        Exchanges a Cognito id_token (Authorization Bearer) for a hub-signed
        (HMAC-SHA256) session token bound to the caller's sub and exactly one
        tenant. Verification order: Cognito single-issuer first, then the optional
        EXTERNAL_ISSUERS allowlist, both fail-closed
        (deploy/hub/lib/cognito-verify.mjs:103-107). A valid login alone is NOT
        enough — the requested tenant is checked against the explicit
        authorization layer (owner / granted / shared)
        (deploy/hub/lib/tenant-store.mjs:71-93); a DynamoDB read error also fails
        closed with 403. Issued token claims:
        {role:"frontend", sub, tenant, access, exp}
        (deploy/hub/lib/http-routes.mjs:86-92). Shared/legacy tenants
        (owner_id in {"api-key",""}) are only reachable when
        CLAW_HUB_SHARED_TENANT_ACCESS=true (default false,
        deploy/hub/lib/config.mjs:50-51).
      x-source: "deploy/hub/lib/http-routes.mjs:52-100"
      x-rbac: owner-gated
      parameters:
        - name: Authorization
          in: header
          required: true
          description: "'Bearer <Cognito id_token>' (token_use=id; aud checked against COGNITO_CLIENT_ID when configured, deploy/hub/lib/cognito-verify.mjs:109-127)."
          schema:
            type: string
            pattern: "^Bearer .+"
          x-source: "deploy/hub/lib/http-routes.mjs:54-59"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  description: Target tenant id. Only trimmed and checked non-empty; authorization (not format) is the gate.
                  x-source: "deploy/hub/lib/http-routes.mjs:68-74"
      responses:
        "200":
          description: Frontend hub token issued.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in]
                properties:
                  token:
                    type: string
                    description: "Hub session token '<base64url claims>.<base64url HMAC-SHA256>' (deploy/hub/lib/hub-token.mjs:8-12). Intended for the browser (WS ?token= and /hub/files/*)."
                    x-source: "deploy/hub/lib/http-routes.mjs:86-94"
                  expires_in:
                    type: integer
                    const: 300
                    description: TOKEN_TTL_SEC.
                    x-source: "deploy/hub/lib/config.mjs:9"
        "400":
          description: tenant_id missing/empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: "tenant_id required"
                x-source: "deploy/hub/lib/http-routes.mjs:70-74"
        "401":
          description: Missing Bearer header ("cognito id_token required") or JWT verification failed ("invalid token").
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: ["cognito id_token required", "invalid token"]
                x-source: "deploy/hub/lib/http-routes.mjs:55-67"
        "403":
          description: Logged-in user is not owner/granted/shared for this tenant, or DDB error (fail closed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: "forbidden: not authorized for this tenant"
                x-source: "deploy/hub/lib/http-routes.mjs:80-85"
        "500":
          description: Unexpected error — including malformed JSON body or body over 1MB (deploy/hub/lib/util.mjs:12-28), both caught by the outer try.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: "internal"
                x-source: "deploy/hub/lib/http-routes.mjs:95-98"

  /hub/channel-token:
    post:
      operationId: hubIssueChannelToken
      summary: Mint a short-lived channel hub token (VM side)
      description: >-
        The tenant VM's channel plugin proves its tenant identity and receives a
        hub session token with claims {role:"channel", tenant, exp}. Two proofs
        coexist during rollout (WI-002, deploy/hub/lib/http-routes.mjs:102-109):
        (1) PREFERRED — Cognito access token of the per-tenant machine-user
        (Authorization Bearer; token_use=access, client_id must equal
        COGNITO_CHANNEL_CLIENT_ID, tenant = unforgeable username claim,
        deploy/hub/lib/cognito-verify.mjs:136-155);
        (2) LEGACY — HMAC-SHA256 body signature over "{appId}:{timestamp}" with
        the per-tenant channel_secret, ±300s clock window plus one-time-nonce
        replay guard (deploy/hub/lib/channel-hmac.mjs:29-56,
        deploy/hub/lib/config.mjs:8). If a Bearer header is present the HMAC
        body path is never consulted (deploy/hub/lib/http-routes.mjs:112-129).
      x-source: "deploy/hub/lib/http-routes.mjs:110-150"
      x-rbac: hmac
      parameters:
        - name: Authorization
          in: header
          required: false
          description: "'Bearer <Cognito access token>' of the per-tenant machine-user (proof 1). Omit to use the legacy HMAC body (proof 2)."
          schema:
            type: string
            pattern: "^Bearer .+"
          x-source: "deploy/hub/lib/http-routes.mjs:112-115"
      requestBody:
        required: false
        description: Required only for the legacy HMAC path (no Bearer header).
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  description: Tenant whose channel_secret signs the request.
                  x-source: "deploy/hub/lib/http-routes.mjs:131-133"
                appId:
                  type: string
                  description: Channel app identifier; part of the signed string "{appId}:{timestamp}".
                  x-source: "deploy/hub/lib/channel-hmac.mjs:29-37"
                timestamp:
                  type: string
                  description: Unix seconds; must be within ±300s of hub clock (TS_WINDOW_SEC).
                  x-source: "deploy/hub/lib/channel-hmac.mjs:32-34"
                signature:
                  type: string
                  description: Hex HMAC-SHA256 of "{appId}:{timestamp}" keyed with the tenant channel_secret. One-time — replay within the window is rejected.
                  x-sensitive: true
                  x-source: "deploy/hub/lib/channel-hmac.mjs:35-55"
      responses:
        "200":
          description: Channel hub token issued.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in]
                properties:
                  token:
                    type: string
                    description: 'Hub session token, claims {role:"channel", tenant, exp}. VM-side credential — must never be exposed to browsers.'
                    x-sensitive: true
                    x-source: "deploy/hub/lib/http-routes.mjs:121-127"
                  expires_in:
                    type: integer
                    const: 300
                    x-source: "deploy/hub/lib/config.mjs:9"
        "401":
          description: Bearer path — access token failed verification ("invalid channel access token"); HMAC path — signature/window/nonce check failed or unknown tenant secret ("bad channel signature").
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      ["invalid channel access token", "bad channel signature"]
                x-source: "deploy/hub/lib/http-routes.mjs:116-120"
        "500":
          description: Unexpected error (also malformed JSON body / body over 1MB on the HMAC path).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: "internal"
                x-source: "deploy/hub/lib/http-routes.mjs:145-148"

