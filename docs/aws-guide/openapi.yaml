          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                x-source: deploy/lambda/api/core/auth.py:579
        "404":
          description: Tenant not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: ["tenant not found"] }
                x-source: deploy/lambda/api/handler.py:104
        "409":
