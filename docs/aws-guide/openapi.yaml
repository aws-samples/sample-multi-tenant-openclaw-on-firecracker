    put:
      operationId: updateSkill
      summary: 创建/替换技能的 SKILL.md
      description: 'Uploads the markdown to s3://$ASSETS_BUCKET/skills/{name}/SKILL.md with SHA-256 metadata, then dispatches the version-aware host syncer through SSM in batches of at most 50 hosts. The five-minute per-host cron is the fallback. The syncer compares S3 VersionId/ETag, verifies content before atomic replacement, and propagates delete markers; a same-size replacement is therefore not skipped. Running microVMs adopt the updated shared skill after their next restart/rebuild. Content must be valid UTF-8, at most 262144 bytes (256 KiB), and contain at least one non-empty top-level "# Title" line. NOTE: over-size content returns 400, not 413. Requires `x-api-key`; mutation is audit-logged via the api Lambda.'
