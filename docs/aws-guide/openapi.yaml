                        type: boolean
                        description: |
                          Present and true ONLY when this request hit its per-request scan budget before filling ?limit rows (#601). The table is scanned with a filter that drops soft-deleted and half-written rows, and DynamoDB applies that filter AFTER its own Limit, so on a table where most rows are filtered out a single request can return few or zero rows while matches still exist further on. When this flag is true the returned page is NOT the end of the data: keep following next_token. Absent means the short/empty page is final. Clients written before #601 keep working — they see the same {tenants, next_token, count} and the cursor always advances, so following it terminates.
