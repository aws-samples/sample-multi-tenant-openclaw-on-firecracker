  /hub/ws:
    get:
      operationId: hubWebSocket
      summary: "WebSocket upgrade — frontend/channel relay (NOT REST)"
      description: >-
        wss://.../hub/ws?token=<hub token>. Auth is the token query parameter
        only; invalid/expired token gets an {"type":"error"} frame then close
        code 1008 (deploy/hub/lib/ws-routing.mjs:70-76). The token's role claim
        picks the routing table: role=channel registers the tenant VM connection
        (ack frame {"type":"registered","tenant"}), role=frontend registers a
        browser tab (ack frame {"type":"ready","tenant"})
        (deploy/hub/lib/ws-routing.mjs:81-99). Max inbound frame 1,000,000 bytes
        (ws maxPayload, deploy/hub/lib/ws-routing.mjs:68). Keepalive: hub sends
        a protocol-level WS PING to each frontend socket every 25s and
        terminates it after 2 unanswered cycles
        (deploy/hub/lib/ws-routing.mjs:100-117).
      x-source: "deploy/hub/lib/ws-routing.mjs:67-132"
      x-rbac: owner-gated
      parameters:
        - name: token
          in: query
          required: true
          description: Hub session token from POST /hub/token (frontend) or POST /hub/channel-token (channel).
          schema:
            type: string
          x-source: "deploy/hub/lib/ws-routing.mjs:70-71"
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade accepted; auth verdict arrives as the first frame).
