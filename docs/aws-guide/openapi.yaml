  /hosts/{instance_id}/copy-file-from-s3:
    post:
      operationId: copyFileFromS3
      summary: 从 S3 拷贝单个文件到宿主机指定位置(同步)
      description: >-
        #309/#334 — Copy ONE file from S3 to a specific path on ONE host (synchronous; single-file copy is
        seconds). For updating host scripts only — the target must be under /opt/openclaw/ (.py host-agent
        service) or /home/ubuntu/ (.sh + lib/*); the image-disk dir /data/firecracker-assets/ is off-limits
        (that's pull-image's job). Landed file is chown ubuntu:ubuntu + chmod 755 (host-agent runs as
        ubuntu; scripts/binaries must be executable). Atomic write (download to same-dir temp → verify →
        chown/chmod → mv), so a truncated transfer never leaves a corrupt file. Path safety: rejects
        directory/trailing-slash/bare-root targets, existing dir/symlink targets, and parent-directory
        symlink escape (resolves the deepest existing ancestor and verifies it stays under an allowed root
        before mkdir). NOTE (#335 follow-up): the pre-check is not a hard TOCTOU boundary against an
        already-compromised host-ubuntu; not reachable from tenant microVMs.
        Return shape merges the repo-standard _err (error+code) with a parseable ProcessingJobStatus, so
        callers can judge success from the JSON alone without depending on the HTTP status code.
