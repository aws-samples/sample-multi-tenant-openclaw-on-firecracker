        '200':
          description: Progress snapshot (tri-state via ProcessingJobStatus).
          content:
            application/json:
              schema:
                type: object
                required:
                  - instance_id
                  - ProcessingJobStatus
                properties:
                  instance_id:
                    type: string
                  host_status:
                    type: string
                    description: Host DDB status (active/idle/upgrading) — NOT the pull status; do not conflate.
                  job_id:
                    type:
                      - string
                      - 'null'
                    description: pull_command_id from the host row (null if never pulled).
                  snapshot_time:
                    type:
                      - string
                      - 'null'
                    description: snapshot_time the host currently records (set on successful install).
                  last_pull_error:
                    type:
                      - string
                      - 'null'
                    description: Last persisted failure reason (DDB), if any.
                  state:
                    type: string
                    enum:
                      - NONE
                      - QUEUED
                      - STAGING
                      - VALIDATING
                      - COMMITTING
                      - SUCCEEDED
                      - FAILED
                      - RECOVERY_REQUIRED
                    description: NONE means this host has no pull job; it is not a persisted Job state.
                  ProcessingJobStatus:
                    type:
                      - string
                      - 'null'
                    enum:
                      - Completed
                      - Failed
                      - InProgress
                      - null
                    description: >-
                      null when state=NONE; Completed=last line SUCCESS; Failed=last line FAIL
                      or DDB last_pull_error set; otherwise InProgress.
                  last_status:
                    type:
                      - string
                      - 'null'
                    description: Raw last line of the progress file (timestamp + what it was doing); null when no job.
                  command_id:
                    type: string
                    description: SSM command id used to tail the progress file.
                  ExitCode:
                    type: integer
                    enum:
                      - 0
                    description: Present only when Completed.
                  ErrorCode:
                    type:
                      - string
                      - 'null'
                    description: >-
                      Present only when Failed. One of DOWNLOAD_FAILED / ETAG_MISMATCH / MANIFEST_MISMATCH /
                      UNZIP_FAILED / INSTALL_MV_FAILED / OWNERSHIP_CHECK_FAILED /
                      POST_COMMIT_FENCED / UNKNOWN (see _PULL_ERROR_CODES).
                  FailureReason:
                    type: string
                    description: Present only when Failed. Detail from the progress file's ERROR line, or DDB last_pull_error.
              x-source: deploy/lambda/api/services/host_service.py:1498
