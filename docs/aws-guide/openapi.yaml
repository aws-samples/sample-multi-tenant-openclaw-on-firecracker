  /chat/sign:
    post:
      operationId: chatSign
      summary: Sign a C-end chat message envelope for the tenant's claw-channel webhook
      description: >-
        Server-signs-for-channel pattern. Verifies the caller's Cognito
        id_token (Bearer, RS256 against the pool JWKS), takes `sub` from the
        VERIFIED claims (never from the body), checks tenant ownership
        (owner/admin/platform-scope via _assert_owner_or_admin), then signs
        HMAC-SHA256(nonce + ts + envelope) with the tenant's channel_secret.
        The per-tenant channel_secret lives only in DDB/VM and is NEVER
        returned to the browser — only the derived signature headers are.
        RBAC route floor is viewer; real authorization is JWT verify + owner
        check inside the handler (core/auth.py:358).
      x-source: deploy/lambda/api/handler.py:72
      x-rbac: owner-gated
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
          description: "Bearer <Cognito id_token>. Verified RS256; forged/expired/alg:none tokens are rejected 401."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, text]
              properties:
                tenant_id:
                  type: string
                  description: Target tenant; must exist and be owned by the caller (or caller is admin).
                  x-source: deploy/lambda/api/handler.py:93
                text:
                  type: string
                  maxLength: 8000
                  description: Message text. Over 8000 chars returns 413 (not 400).
                  x-source: deploy/lambda/api/handler.py:97
      responses:
        "200":
          description: Signed envelope; the client POSTs `body` verbatim to `path` with the returned headers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    example: "/chat/{tenant_id}/inbound"
                    description: Per-VM webhook path (CloudFront -> ALB -> nginx).
                  body:
                    type: string
                    description: 'Canonical compact JSON envelope {"sub","text"} with the server-derived sub baked in — must be posted byte-for-byte.'
                    x-source: deploy/lambda/api/handler.py:117
                  headers:
                    type: object
                    properties:
                      x-claw-signature:
                        type: string
                        description: Hex HMAC-SHA256(nonce + ts + body) keyed by the tenant channel_secret (never exposed).
                      x-claw-random:
                        { type: string, description: 16-byte hex nonce. }
                      x-claw-timestamp:
                        {
                          type: string,
                          description: Unix seconds; webhook enforces a +/-300s window.,
                        }
                x-source: deploy/lambda/api/handler.py:125
        "400":
          description: Body is not valid JSON, or tenant_id/text missing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                x-source: deploy/lambda/api/handler.py:92
        "401":
          description: No Bearer token, unverifiable token, or verified token missing sub.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
