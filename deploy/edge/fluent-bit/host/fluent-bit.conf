# deploy/edge/fluent-bit/host/fluent-bit.conf — host log shipper.
#
# Two independent pipelines on each Firecracker host:
#   host.platform → journald (host-agent unit + claw-launch lifecycle scripts)
#                 → claw-logs-host-* index  (platform ops logs, one per host)
#   host.vm       → tail /data/firecracker-vms/*/fc.log (per-tenant VMM logs,
#                   380/host) with tenant_id extracted from the path
#                 → claw-logs-vm-* index    (per-tenant, no-cross-tenant field)
#
# Deployed by install-fluent-bit.sh (FB_ROLE=host) to /etc/fluent-bit/.
# Config-gated: install skips entirely when LOGGING_ENABLED=false.
# Two Firehose streams keep the indices / ISM retention independent.

[SERVICE]
    Flush               5
    Grace               30
    Daemon              Off
    Log_Level           info
    Parsers_File        parsers.conf
    HTTP_Server         On
    HTTP_Listen         127.0.0.1
    HTTP_Port           2020
    Health_Check        On
    HC_Errors_Count     5
    HC_Retry_Failure_Count 5
    HC_Period           60
    storage.path        /var/lib/fluent-bit/storage
    storage.sync        normal
    storage.checksum    off
    storage.metrics     on
    storage.max_chunks_up 128

# ── Platform logs: journald (host-agent + claw-launch) ───────────────────
[INPUT]
    Name                systemd
    Tag                 host.platform
    Systemd_Filter      _SYSTEMD_UNIT=host-agent.service
    Systemd_Filter      SYSLOG_IDENTIFIER=claw-launch
    # 显式固定多条件为 OR(host-agent 或 claw-launch 命中即采)。Or 本就是 Fluent Bit
    # 默认值,此处显式写出以锁定意图、防未来版本改默认,行为不变(#375 / PR #91)。
    Systemd_Filter_Type Or
    DB                  /var/lib/fluent-bit/journal-host.db
    Read_From_Tail      On
    # #479 真机 A/B:_SYSTEMD_UNIT 带前导下划线时 On 会让过滤零命中。
    Strip_Underscores   Off
    storage.type        filesystem
    Mem_Buf_Limit       20M

# ── Per-tenant VM logs: tail fc.log, tenant_id from path ─────────────────
[INPUT]
    Name                tail
    Tag                 host.vm
    Path                /data/firecracker-vms/*/fc.log
    Path_Key            log_path
    DB                  /var/lib/fluent-bit/tail-fcvm.db
    Refresh_Interval    10
    Rotate_Wait         5
    Skip_Long_Lines     On
    storage.type        filesystem
    Mem_Buf_Limit       50M

# ── Per-tenant guest app logs: tail oc-guest.log (vsock reader 落的文件) ──
# guest 内 OpenClaw 三类日志经 vsock → host oc-guest-log-reader.py 落 per-VM
# oc-guest.log。复用 host.vm tag → 同 lua 提 tenant_id + 同 Firehose 流,零改
# filter/output。文件不存在(OC_GUEST_LOG_ENABLED=false)时 tail 空转无害。
[INPUT]
    Name                tail
    Tag                 host.vm
    Path                /data/firecracker-vms/*/oc-guest.log
    Path_Key            log_path
    DB                  /var/lib/fluent-bit/tail-ocguest.db
    Refresh_Interval    10
    Rotate_Wait         5
    # JSON parser:reader 落的每行是 {"tenant_id","log_source","line"} envelope,
    # 解析后 log_source/line 成 Firehose 顶层字段(不再是嵌套字符串,#8)。
    Parser              oc_guest_json
    # Buffer 64KB > reader envelope 上限 MAX_FRAME(32768)+ 换行:reader 单帧最大
    # 32768 字节,加 "\n" = 32769,若 buffer 只设 32k(=32768)边界记录正好超 1 字节被
    # Skip_Long_Lines 跳(codex 抓的 off-by-one)。设 64k 留足余量,合法帧永不误丢。
    Buffer_Chunk_Size   64k
    Buffer_Max_Size     64k
    Skip_Long_Lines     On
    storage.type        filesystem
    Mem_Buf_Limit       50M

[FILTER]
    Name                lua
    Match               host.vm
    script              extract_tenant_id.lua
    call                extract_tenant_id

# ── Instance metadata on both pipelines ──────────────────────────────────
[FILTER]
    Name                aws
    Match               host.*
    imds_version        v2
    az                  true
    ec2_instance_id     true

# ── @timestamp on both pipelines (#265) ──────────────────────────────────
# The Console log query range-filters and sorts on @timestamp; Fluent Bit keeps
# the event time out-of-band and no output sets time_key, so without this the
# claw-logs-* index has no date field and every query 502s with
# query_shard_exception. Must stay ahead of the outputs. One Match covers
# host.platform and host.vm both.
[FILTER]
    Name                lua
    Match               host.*
    script              add_timestamp.lua
    call                add_timestamp
    time_as_table       On

# ── Outputs: one Firehose stream per index ───────────────────────────────
[OUTPUT]
    Name                kinesis_firehose
    Match               host.platform
    region              ${FB_REGION}
    delivery_stream     ${FB_STREAM_HOST}
    auto_retry_requests true
    Retry_Limit         False
    storage.total_limit_size 2G

[OUTPUT]
    Name                kinesis_firehose
    Match               host.vm
    region              ${FB_REGION}
    delivery_stream     ${FB_STREAM_VM}
    auto_retry_requests true
    Retry_Limit         False
    storage.total_limit_size 4G
