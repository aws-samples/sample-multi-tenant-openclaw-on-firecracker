            schema:
              type: object
              required:
                - target
                - s3_uri
              properties:
                target:
                  type: string
                  description: 'Absolute EC2 path, full filename, under /opt/openclaw/ or /home/ubuntu/ (no .., no trailing slash, not the dir itself).'
                  example: /home/ubuntu/manifest3.json
                s3_uri:
                  type: string
                  pattern: '^s3://.+'
                  description: >-
                    s3://<bucket>/<key> of the source object. API-layer check only requires the s3://
                    prefix and length > "s3://" (so s3://bucket with no key passes API validation; a
                    missing/invalid object then fails at the host aws s3 cp step → 502).
                  example: s3://<assets-bucket>/deployment/rootfs/manifest.json
