<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1620" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#2b3a55"/></marker>
    <marker id="arrRet" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3f9d52"/></marker>
    <marker id="arrData" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#ec7211"/></marker>
  </defs>

  <text x="40" y="42" font-size="27" font-weight="700" fill="#16233a">External SaaS Platform Integration &#183; End-to-End Auth &amp; Data-Plane Chat Sequence</text>
  <text x="40" y="70" font-size="15" fill="#5a6b85">Tier-A federation &#183; backend brokered tenant provisioning &#183; per-user isolated openclaw &#183; Cognito as single trust root &#183; self-registration disabled</text>

  <rect x="30" y="120" width="1700" height="300" fill="#ece1fb" opacity="0.30"/>
  <rect x="30" y="420" width="1700" height="336" fill="#fde9d6" opacity="0.30"/>
  <rect x="30" y="756" width="1700" height="250" fill="#dbeccf" opacity="0.30"/>
  <rect x="30" y="1006" width="1700" height="470" fill="#d7e6f5" opacity="0.30"/>
  <text x="44" y="142" font-size="14" font-weight="700" fill="#7a4fd0">&#9312; Identity federation (user logs into external platform &#8594; external IdP federates into Cognito, trust root converges)</text>
  <text x="44" y="442" font-size="14" font-weight="700" fill="#c15c14">&#9313; Tenant provisioning (backend brokers a dedicated microVM &#183; not user self-service)</text>
  <text x="44" y="778" font-size="14" font-weight="700" fill="#2f7d40">&#9314; Data-plane onboarding (enter chat frontend &#8594; obtain hub token &#8594; open wss)</text>
  <text x="44" y="1028" font-size="14" font-weight="700" fill="#2b5a8c">&#9315; Real-time chat (frontend &#8646; hub &#8646; microVM/openclaw &#183; three-gate isolation)</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <g><rect x="46" y="86" width="128" height="46" rx="6" fill="#3f9d52"/><text x="110" y="105" fill="#fff">Platform end user</text><text x="110" y="122" fill="#eafbe8" font-size="10.5" font-weight="400">browser</text></g>
    <g><rect x="256" y="86" width="128" height="46" rx="6" fill="#5a6b85"/><text x="320" y="105" fill="#fff">Platform frontend</text><text x="320" y="122" fill="#e8edf5" font-size="10.5" font-weight="400">customer SPA</text></g>
    <g><rect x="476" y="86" width="128" height="46" rx="6" fill="#9b6dff"/><text x="540" y="105" fill="#fff">External IdP</text><text x="540" y="122" fill="#efe8ff" font-size="10.5" font-weight="400">external OIDC</text></g>
    <g><rect x="696" y="86" width="128" height="46" rx="6" fill="#5a6b85"/><text x="760" y="105" fill="#fff">Platform backend</text><text x="760" y="122" fill="#e8edf5" font-size="10.5" font-weight="400">customer backend</text></g>
    <g><rect x="916" y="86" width="128" height="46" rx="6" fill="#ec7211"/><text x="980" y="105" fill="#fff">Control plane API</text><text x="980" y="122" fill="#fde7d6" font-size="10.5" font-weight="400">API GW&#8594;Lambda</text></g>
    <g><rect x="1126" y="86" width="128" height="46" rx="6" fill="#9b6dff"/><text x="1190" y="105" fill="#fff">Cognito</text><text x="1190" y="122" fill="#efe8ff" font-size="10.5" font-weight="400">single User Pool</text></g>
    <g><rect x="1336" y="86" width="128" height="46" rx="6" fill="#2f7d40"/><text x="1400" y="105" fill="#fff">Chat frontend</text><text x="1400" y="122" fill="#dff0e2" font-size="10.5" font-weight="400">embedded in your domain</text></g>
    <g><rect x="1496" y="86" width="128" height="46" rx="6" fill="#3f9d52"/><text x="1560" y="105" fill="#fff">Hub (WS)</text><text x="1560" y="122" fill="#eafbe8" font-size="10.5" font-weight="400">server.mjs :8790</text></g>
    <g><rect x="1636" y="86" width="100" height="46" rx="6" fill="#1e2738"/><text x="1686" y="105" fill="#fff">microVM</text><text x="1686" y="122" fill="#c9d2e3" font-size="10.5" font-weight="400">openclaw</text></g>
  </g>
  <g stroke="#c2cbd9" stroke-width="1.4" stroke-dasharray="4 4">
    <line x1="110" y1="132" x2="110" y2="1478"/><line x1="320" y1="132" x2="320" y2="1478"/><line x1="540" y1="132" x2="540" y2="1478"/>
    <line x1="760" y1="132" x2="760" y2="1478"/><line x1="980" y1="132" x2="980" y2="1478"/><line x1="1190" y1="132" x2="1190" y2="1478"/>
    <line x1="1400" y1="132" x2="1400" y2="1478"/><line x1="1560" y1="132" x2="1560" y2="1478"/><line x1="1686" y1="132" x2="1686" y2="1478"/>
  </g>

  <g font-size="12.5" fill="#2b3a55" text-anchor="middle">
    <line x1="110" y1="170" x2="316" y2="170" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="213" y="163">1. Visit external platform</text>
    <line x1="320" y1="200" x2="536" y2="200" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="428" y="193">2. Initiate login (authorization_code + PKCE)</text>
    <line x1="536" y1="230" x2="114" y2="230" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="325" y="223">3. User logs in on their own platform (platform-native account)</text>
    <line x1="114" y1="260" x2="536" y2="260" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="325" y="253">4. Submit credentials &#8594; external IdP issues authz code</text>
    <line x1="540" y1="290" x2="1186" y2="290" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="863" y="283" fill="#2f7d40">5. Federated callback to Cognito /oauth2/idpresponse (customProvider=external-idp)</text>
    <rect x="1115" y="304" width="150" height="24" rx="4" fill="#9b6dff"/>
    <text x="1190" y="320" fill="#fff" font-size="11">6. Pre-Token-Gen injects claim</text>
    <line x1="1186" y1="360" x2="324" y2="360" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="755" y="353" fill="#2f7d40">7. Platform id_token {sub, custom:tenant_user_id, custom:platform_id, exp} back to frontend</text>
    <text x="325" y="392" font-size="11" fill="#5a6b85">(user now authenticated, holding a trusted platform id_token)</text>

    <line x1="320" y1="470" x2="756" y2="470" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="538" y="463">8. Request to purchase / provision AI pro in-platform (with id_token)</text>
    <line x1="760" y1="500" x2="976" y2="500" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="868" y="493">9. POST /tenants (backend brokered)</text>
    <text x="868" y="514" font-size="11" fill="#5a6b85">x-api-key + forward user Bearer id_token (tenant_user_id read from claim, not body) &#183; not self-service</text>
    <rect x="905" y="528" width="150" height="38" rx="4" fill="#ec7211"/>
    <text x="980" y="544" fill="#fff" font-size="11">10. Verify sig + owner binding</text>
    <text x="980" y="559" fill="#fde7d6" font-size="10">create isolated node per tenant_user_id</text>
    <line x1="1055" y1="586" x2="1186" y2="586" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="1120" y="579" font-size="11">11. Create channel</text>
    <text x="1120" y="593" font-size="10" fill="#5a6b85">machine-user</text>
    <line x1="1055" y1="621" x2="1682" y2="621" stroke="#ec7211" stroke-width="1.6" marker-end="url(#arrData)"/>
    <text x="1360" y="614" fill="#c15c14">12. SSM launch-vm: cold-inject identity/skill/channel secret to read-only disk &#8594; start microVM</text>
    <line x1="1682" y1="651" x2="1057" y2="651" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="1360" y="644" fill="#2f7d40">13. vm_health up (host-agent reports, ~4.0s)</text>
    <line x1="976" y1="681" x2="764" y2="681" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="870" y="674" fill="#2f7d40">14. 202 {id, status:queued}</text>
    <line x1="976" y1="711" x2="764" y2="711" stroke="#3f9d52" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrRet)"/>
    <text x="870" y="704" fill="#2f7d40" font-size="11">15. Backend polls GET /tenants/{id} until running</text>
    <line x1="1682" y1="738" x2="1564" y2="738" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="1623" y="731" fill="#2f7d40" font-size="10.5">16. channel dial OUT</text>

    <line x1="110" y1="808" x2="1396" y2="808" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="753" y="801">17. User enters chat frontend (in-platform landing redirect, already authed with id_token, seamless)</text>
    <line x1="1400" y1="838" x2="1556" y2="838" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="1478" y="831" font-size="11">18. POST /hub/token</text>
    <text x="1478" y="845" font-size="10" fill="#5a6b85">Bearer id_token + {tenant_id}</text>
    <rect x="1485" y="858" width="150" height="38" rx="4" fill="#3f9d52"/>
    <text x="1560" y="874" fill="#fff" font-size="11">19. JWKS verify +</text>
    <text x="1560" y="889" fill="#eafbe8" font-size="10">authorizeSubForTenant</text>
    <line x1="1556" y1="924" x2="1404" y2="924" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="1480" y="917" fill="#2f7d40" font-size="10.5">20. Short-lived frontend token</text>
    <line x1="1400" y1="960" x2="1556" y2="960" stroke="#2b3a55" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1478" y="953" font-size="11">21. Open wss /hub/ws?token=</text>
    <rect x="1485" y="974" width="150" height="24" rx="4" fill="#3f9d52"/>
    <text x="1560" y="990" fill="#fff" font-size="10.5">22. verifyHubToken stamps _tenant</text>

    <line x1="110" y1="1058" x2="1396" y2="1058" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="753" y="1051">23. Type chat message</text>
    <line x1="1400" y1="1088" x2="1556" y2="1088" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="1478" y="1081" font-size="10.5">24. wss frame msg_create</text>
    <text x="1478" y="1095" font-size="9.5" fill="#5a6b85">parts[TEXT]+threadId+clientMessageId</text>
    <rect x="1485" y="1108" width="150" height="38" rx="4" fill="#3f9d52"/>
    <text x="1560" y="1124" fill="#fff" font-size="11">25. senderId=verified sub</text>
    <text x="1560" y="1139" fill="#eafbe8" font-size="10">deliverToChannel(tenant)</text>
    <line x1="1564" y1="1172" x2="1682" y2="1172" stroke="#ec7211" stroke-width="1.6" marker-end="url(#arrData)"/>
    <text x="1623" y="1165" fill="#c15c14" font-size="10.5">26. Deliver to channel</text>
    <path d="M1686,1200 h40 v30 h-40" fill="none" stroke="#ec7211" stroke-width="1.5" marker-end="url(#arrData)"/>
    <text x="1660" y="1220" fill="#c15c14" font-size="10.5" text-anchor="end">27. openclaw&#8594;LiteLLM&#8594;Bedrock</text>
    <line x1="1682" y1="1258" x2="1564" y2="1258" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="1623" y="1251" fill="#2f7d40" font-size="10.5">28. reply_delta</text>
    <line x1="1556" y1="1288" x2="1404" y2="1288" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="1480" y="1281" fill="#2f7d40" font-size="10.5">29. Streamed reply</text>
    <line x1="1396" y1="1318" x2="114" y2="1318" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/>
    <text x="753" y="1311" fill="#2f7d40">30. Incrementally render chat bubble (only to this sub's tab where fws._tenant===tenant &#183; replace same clientMessageId)</text>
  </g>

  <rect x="740" y="1348" width="760" height="60" rx="6" fill="#fdeaea" stroke="#d9534f" stroke-width="1.3"/>
  <text x="752" y="1368" font-size="12.5" font-weight="700" fill="#c0392b">Cross-tenant isolation, three structural gates (never trust client self-report)</text>
  <text x="752" y="1386" font-size="11.5" fill="#8a2f28">&#9312; Frontend short token bound to a single tenant (stamped at hub issuance) &#9313; channel proves tenant via Cognito access_token username claim (unforgeable)</text>
  <text x="752" y="1402" font-size="11.5" fill="#8a2f28">&#9314; Matching happens only when fws._tenant===frame._tenant &#183; senderId uses server-verified sub &#183; authz checks owner_id/authorized_users (server-side, never trust JWT self-claim)</text>

  <g font-size="12" fill="#2b3a55">
    <text x="44" y="1450" font-weight="700">Legend:</text>
    <line x1="96" y1="1446" x2="136" y2="1446" stroke="#2b3a55" stroke-width="1.6" marker-end="url(#arr)"/><text x="142" y="1450">Request</text>
    <line x1="222" y1="1446" x2="262" y2="1446" stroke="#3f9d52" stroke-width="1.6" marker-end="url(#arrRet)"/><text x="268" y="1450">Response</text>
    <line x1="352" y1="1446" x2="392" y2="1446" stroke="#ec7211" stroke-width="1.6" marker-end="url(#arrData)"/><text x="398" y="1450">Deploy/data</text>
    <rect x="524" y="1439" width="14" height="14" fill="#9b6dff"/><text x="544" y="1450">Internal (verify/inject)</text>
    <line x1="676" y1="1446" x2="716" y2="1446" stroke="#3f9d52" stroke-width="1.4" stroke-dasharray="5 3"/><text x="722" y="1450">Poll</text>
  </g>

  <g font-size="11" fill="#6b7a92">
    <text x="44" y="1502">Source (first-hand file:line): hub endpoints/token/wss frames the hub design doc &#167;1-5 + server.mjs:249-267 (JWKS verify)/402-472 (token)/623-772 (matching); control plane POST /tenants (broker path)</text>
    <text x="44" y="1520">+ owner gating handler.py + Pre-Token-Gen/TenantTable/multi-IdP federation modeled on aws-samples/amazon-cognito-example-for-multi-tenant (cloned to opensource/); chat frontend reuses existing console/chat (Hosted UI + PKCE federation ready).</text>
    <text x="44" y="1538" fill="#c15c14">Note: user self-registration disabled (/tenants/self exists but unused in this flow), tenants brokered by platform backend; chat UI embedded in customer domain in production, not a standalone domain. custom claim/federation/Pre-Token-Gen are Tier-A pending items; currently single Cognito Pool direct, no external IdP wired.</text>
  </g>
</svg>
