                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - ACCESS_DENIED
        '404':
          description: Tenant not found; migrate target host not found.
          content:
            application/json:
              schema:
                type: object
                properties:
