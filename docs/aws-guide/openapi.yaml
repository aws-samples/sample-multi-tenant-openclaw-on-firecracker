      x-rbac: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - backup
                    - delete
                    - start
                    - stop
                  description: Lifecycle action applied to every target tenant.
                  x-source: deploy/lambda/api/handler.py:1248
                ids:
                  type: array
                  items:
                    type: string
                  maxItems: 100000
                  description: |
                    Explicit tenant id list. Mutually exclusive with `filter` (exactly one of the two must be present, else 400). Lists larger than 100 route to the async job path; the hard per-request cap is 100000.
                  x-source: deploy/lambda/api/handler.py:1263-1278
                filter:
                  type: object
                  description: |
                    Server-side target resolution. The only supported key is `tag` with a "key:value" string; a tag value without a colon matches nothing. Unknown keys are rejected with 400. Non-admin callers only match tenants they own.
                  properties:
                    tag:
                      type: string
                      description: Tag filter in "key:value" form.
                      x-source: deploy/lambda/api/services/fleet_service.py:460-465
                  additionalProperties: false
                  x-source: deploy/lambda/api/handler.py:1249,1280-1287
                async:
                  type: boolean
                  default: false
                  description: |
                    Force the async job path even for small batches. Implicitly true when ids/filter resolve to more than 100 targets.
                  x-source: deploy/lambda/api/handler.py:1294
