# deploy/edge/nginx.conf — OpenClaw Pool edge (OpenResty).
#
# Data-plane entry for the two-level route:
#   ALB (LOR, default rule) → this OpenResty box → Redis lookup → set peer →
#   proxy_pass to host:host_port (peer's DNAT) or guest_ip:18789 (local branch).
#
# This file is deployed to /usr/local/openresty/nginx/conf/nginx.conf by
# install-edge.sh. The Lua modules live in /usr/local/openresty/lualib/edge/.
#
# Contract owners for the shape of the route entry:
#   the design spec: the data-plane contract

# Run as an unprivileged user; the systemd unit provides read-only access to
# /etc/openresty/, config-only.
user  nobody;
# One worker per vCPU. On c6in.xlarge that's 4; on larger classes epoll +
# reuseport across all workers still scales. worker_processes auto lets
# OpenResty read /proc/cpuinfo at start.
worker_processes  auto;
worker_cpu_affinity auto;

# Every worker needs to hold 30w conns / 3 boxes / N workers headroom plus
# upstream sockets doubled per request. 1M is the industry ceiling matching
# fs.file-max in install-edge.sh sysctl.
worker_rlimit_nofile 1048576;

# systemd forking 模式下 nginx master 脱离控制终端,/dev/stderr(=/proc/self/fd/2)
# 打不开(open() failed 6: No such device or address,P7 真机实撞)。改走 syslog
# → journald,`journalctl -u claw-edge` 照样能看,不依赖 attached 终端。
error_log syslog:server=unix:/dev/log,nohostname notice;

events {
    use epoll;
    # Multi-accept improves accept queue drain under CPS bursts (see
    # the test plan §5.3 "5000 conn/s tcpkali").
    multi_accept on;
    # Match worker_rlimit_nofile so a single worker can hold all its
    # allotted FDs.
    worker_connections 1048576;
}

http {
    # ── Lua module paths ────────────────────────────────────────────────
    # install-edge.sh symlinks the repo's deploy/edge/{lib,route.lua}
    # under /usr/local/openresty/lualib/edge/.
    lua_package_path  "/usr/local/openresty/lualib/?.lua;;";

    # ── DNS resolver (the data-plane contract §8) ────────────────────────────
    # VPC-provided resolver (RFC-mandated .2 of the VPC CIDR is aliased to
    # 169.254.169.253 for the on-instance stub). valid=30s forces cached
    # A records to expire every 30s so ElastiCache primary endpoint DNS —
    # which AWS updates within seconds of a Multi-AZ failover — is picked
    # up by the next request instead of a stale IP living forever in
    # nginx's default (indefinite) resolver cache. ipv6=off avoids AAAA
    # miss delays; ElastiCache endpoints are A records.
    resolver 169.254.169.253 valid=30s ipv6=off;
    resolver_timeout 3s;

    default_type application/octet-stream;

    # ── WebSocket Connection header (nginx 官方 WS 反代标准写法)──────────
    # 上游收到的 Connection 头必须按本次请求是否 WS 动态决定,不能原样透传
    # 客户端的 $http_connection:WS 请求 → "upgrade";非 WS(SSE/普通 HTTP)
    # → "close"。透传的坑:多层代理(CloudFront→ALB→edge)后 $http_connection
    # 可能残留 keep-alive 或与 $http_upgrade 不一致,上游据此误判握手。
    # 见 nginx.org/en/docs/http/websocket.html。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Trace ID fallback: prefer X-Amzn-Trace-Id, fallback $request_id ──
    map $http_x_amzn_trace_id $edge_trace {
        default $http_x_amzn_trace_id;
        ''      $request_id;
    }

    # ── Structured JSON access log (F19: escape=json, 1.11.8+) ──────────
    # Fields aligned to design.md Structured_Log_Record; trace_root extracted
    # by Fluent Bit FILTER (deploy/edge/fluent-bit/); $edge_trace carries the
    # raw X-Amzn-Trace-Id or $request_id fallback (map above).
    # IMPORTANT: $uri intentionally used (not $request or $request_uri) to
    # avoid logging query-string tokens (F20 — DO NOT CHANGE to $request).
    log_format edge_access escape=json
        '{"time":"$time_iso8601",'
        '"service":"edge",'
        '"host":"$host",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"upstream_addr":"$upstream_addr",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"body_bytes_sent":$body_bytes_sent,'
        '"tenant_id":"$edge_tenant_id",'
        '"route_source":"$edge_route_source",'
        '"trace":"$edge_trace",'
        '"trace_root":"$edge_trace_root",'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer"}';
    access_log syslog:server=unix:/dev/log,nohostname,tag=claw_edge edge_access;

    server_tokens off;

    # ── TCP / keepalive tuning for SSE + WS long-lived flows ────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # SSE / long-lived streams: keep the client → edge socket alive
    # generously; the microVM gateway itself decides when to close.
    keepalive_timeout 300s;
    keepalive_requests 10000;
    # Headers can carry per-tenant tokens up to a few kB; bump defaults.
    large_client_header_buffers 4 32k;
    client_body_buffer_size 32k;
    client_max_body_size 32m;
    underscores_in_headers on;

    # ── Shared dicts owned by route.lua / backend.lua ───────────────────
    # route_cache: L2 cache of Redis descriptors (JSON) + negative markers.
    # Sizing: ~200B per entry → 128m holds ~600k live entries, plenty for
    # 100k tenants + churn.
    lua_shared_dict route_cache 128m;
    # route_locks: lua-resty-lock coordinator (small, per-tenant flag).
    lua_shared_dict route_locks 8m;
    # edge_ready: single boolean gate written by init_worker's async
    # Redis PING and read by /healthz. See §6 of the data-plane contract —
    # ASG must not receive traffic until the box actually reaches Redis
    # or the ELB health check will 200 immediately on a cold, unwired
    # instance (routes cache empty, upstream Redis unresolved) and the
    # instance gets slammed while it can only fail-static 503.
    lua_shared_dict edge_ready 12k;

    # ── init worker ─────────────────────────────────────────────────────
    init_worker_by_lua_block {
        require("edge.route").on_init_worker()
    }

    # ── Upstream: single virtual upstream picked entirely by Lua ────────
    # No static server list — balancer_by_lua_block calls set_current_peer
    # with the descriptor stashed by rewrite_by_lua. The dummy 0.0.0.1:1
    # server keeps nginx's config valid.
    upstream microvm_gateway {
        server 0.0.0.1:1;  # placeholder; Lua overrides per-request
        balancer_by_lua_block {
            require("edge.route").on_balancer()
        }
        # Keepalive to reuse TCP to the same host:port (best hit rate when
        # the same tenant fans in from the same client repeatedly).
        keepalive 512;
        keepalive_requests 10000;
        keepalive_timeout 300s;
    }

    server {
        # ALB origin talks HTTP to us (TLS termination at ALB with ACM cert).
        # reuseport spreads accept() across workers under CPS bursts.
        listen 8080 default_server reuseport backlog=65535;
        server_name _;

        # Set by rewrite phase for the access log format and log_by_lua.
        set $edge_tenant_id "-";
        set $edge_route_source "-";
        set $edge_trace_root "-";
        # nginx.conf-configured Redis endpoint (install-edge.sh templates
        # ENGINE_REDIS_ENDPOINT into these). $edge_redis_host/port are
        # read from ngx.var inside backend.lookup_backend.
        set $edge_redis_host  "${ENGINE_REDIS_HOST}";
        set $edge_redis_port  "${ENGINE_REDIS_PORT}";
        # Host self-IP (private IP). install-edge.sh templates this from
        # IMDS local-ipv4 at first boot; balancer_pick uses it to decide
        # local vs remote branch.
        set $edge_self_ip "${EDGE_SELF_IP}";

        # ── /healthz — ALB target-group health check ────────────────────
        # Warmup gate (the data-plane contract §6): returns 503 until the async
        # init_worker task in route.lua completes a successful Redis PING
        # and sets edge_ready:"ready"=1. This prevents the well-known
        # "cold instance passes ELB check with empty routes" trap where
        # ASG grace_period alone isn't enough — nginx accepts on :8080 in
        # ~200ms but Redis reachability + worker init take seconds.
        location = /healthz {
            access_log off;
            default_type text/plain;
            content_by_lua_block {
                local flag = ngx.shared.edge_ready
                if flag and flag:get("ready") == 1 then
                    ngx.status = 200
                    ngx.say("ok")
                else
                    ngx.status = 503
                    ngx.say("warmup")
                end
            }
        }

        # ── /metrics — Prometheus scrape ────────────────────────────────
        # Bind loopback + private-VPC only via SG; access log off so scrape
        # noise doesn't drown real traffic. Content is a small Lua stub;
        # detailed metrics wiring is a P6 concern (the test plan §7 P6).
        location = /metrics {
            access_log off;
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain; version=0.0.4"
                ngx.say("# HELP edge_up placeholder for P6 metrics")
                ngx.say("edge_up 1")
            }
        }

        # ── /ws/{tenant_id}/... — main data-plane entry (SSE + WS) ──────
        location ~ ^/ws/[^/]+ {
            # Rewrite phase: extract tenant, resolve backend, stash in ctx.
            rewrite_by_lua_block {
                require("edge.route").on_rewrite()
                -- Also mirror onto access log vars for edge_access format.
                ngx.var.edge_tenant_id   = tostring(ngx.ctx.tenant_id or "-")
                ngx.var.edge_route_source = tostring(ngx.ctx.route_source or "-")
                -- Extract trace_root 24-hex from X-Amzn-Trace-Id (Property 1).
                -- Uses the shared trace_root.lua contract; does NOT modify its logic.
                local tr = require("edge.lib.trace_root")
                local raw = ngx.var.http_x_amzn_trace_id or ""
                local root = tr.extract(raw)
                ngx.var.edge_trace_root = (root ~= "" and root) or "-"
            }

            # HTTP/1.1 with proper Upgrade forwarding for WS + SSE.
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # Connection 按 $http_upgrade 动态决定(map 上方定义):WS→upgrade、
            # 非 WS→close。不透传客户端 $http_connection(多层代理后不可靠)。
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # ── SSE / streaming hygiene ────────────────────────────────
            # OFF: nginx must not batch bytes; SSE clients rely on
            # immediate flush of every frame.
            proxy_buffering off;
            proxy_request_buffering off;
            # Long-lived pins: SSE conversations can idle between tokens
            # for tens of seconds; WS sessions run for minutes. Keep the
            # upstream leg wider than the ALB idle timeout (3600s per
            # the data-plane contract §6 — ALB and OpenResty share 3600s).
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # ── R6.3② edge failover 重投 ────────────────────────────────
            # 迁移完成时源 host DNAT 被拆(release-route),内核对残留在途流量
            # 立即 RST/refused。这里让 nginx 触发一次 upstream 重试:
            # balancer_by_lua 检测 get_last_failure 就调 backend.invalidate 清
            # route 缓存 + 重查 Redis 拿新 desc,再对新 peer set_current_peer。
            # SHALL NOT 含 http_5xx:5xx 是上游业务错误(auth 拒/护栏拒),不重
            # 投避免放大后端负载 + 冒充成功。non_idempotent 允许:重投的是握手
            # 阶段,响应头未开始转发,幂等语义仍成立(见 references R6-edge-failover)。
            # 响应头一旦开始转发,proxy_next_upstream 就不再触发(nginx 官方语义,
            # WS/SSE 长连接的字节流不会被误重投)。
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;  # 一次重投,失败即 502

            # on_rewrite (route.lua)已 ngx.req.set_uri 把 `/ws/<tid>` 路由前缀
            # strip 掉:microVM gateway 在根提供 OpenAI 兼容家族(/v1/...)与原生
            # WS 握手(/),不认带 `/ws/<tid>` 前缀的 URI(真机实测带前缀 404、
            # strip 后 401/200)。proxy_pass 无 URI 部分 → 用 set_uri 后的 $uri。
            proxy_pass http://microvm_gateway;

            log_by_lua_block {
                require("edge.route").on_log()
            }
        }

        # Anything else: 404 (hide implementation, no default backend).
        location / {
            return 404;
        }
    }
}
