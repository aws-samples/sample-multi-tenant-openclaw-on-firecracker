            Both slots install into an immutable per-host version dir
            (versions/<snapshot_time>/) and atomically update slots.json. `live` CAS-flips the
            host to `upgrading` for the duration. `canary` updates only the canary pointer —
            it does NOT change host.status, so live tenants keep being created/scheduled on
