# deploy/edge/fluent-bit/host/parsers.conf — parsers for host log shipper.
#
# fc.log lines are plain firecracker Info-level text (not JSON); the tail
# input ships them as-is under the "log" key. No parser needed for the vm
# pipeline. journald records are already structured by the systemd input.
# Kept as a file so Parsers_File in fluent-bit.conf resolves; add parsers
# here if a future source needs one.

# oc-guest.log lines are the reader's JSON envelope
# ({"tenant_id","log_source","line"}). Parse so log_source/tenant_id/line
# become top-level fields in the Firehose record (not a nested string).
[PARSER]
    Name        oc_guest_json
    Format      json
