      description: 'Config-gated (env EXTERNAL_AUTHZ, default false — returns 404 when disabled). Authenticated by HMAC signature, NOT Cognito/RBAC: the route is in _RBAC_SKIP (core/auth.py:589) and verified inside the handler. Signature = HMAC-SHA256(EXTERNAL_AUTHZ_SECRET, "{timestamp}.{raw_body}") hex digest, compared with hmac.compare_digest; timestamp must be unix seconds within +/-EXTERNAL_AUTHZ_TS_WINDOW (default 300s) for replay protection. Writes grant/revoke into the tenant''s authorized_users map.'
