        GET /list_image_versions and pull-image (live/canary) rejects it (404). Reference-protected:
        refuses (409 IMAGE_VERSION_IN_USE) if any host slot (live/canary/previous_live) or any
        non-deleted tenant's image_snapshot_time still pins it. Idempotent: already-deleted → 200;
