      summary: 把指定版本快照装到单台宿主机(异步)
      description: >-
        #309/#333 — Install a specific version snapshot onto ONE host. Reads the snapshot from the
        version-snapshots DDB table, selects exactly the disks named by that snapshot's manifest.json
        (rootfs / data-template / immutable) plus manifest.json itself (ignores other versions' disks
        in the snapshot — deterministic), fetches each by its exact S3 VersionId, verifies ETag, then
        installs into an immutable per-host version directory and atomically updates slots.json.
        Live pulls CAS-flip the host active/idle→upgrading (and
        atomically stamps pull_command_id) so the control plane places no new tenants during the pull,
        then self-invokes asynchronously (InvocationType=Event) and returns 202 immediately — the long
        stage+unzip+commit chain runs in the fire-and-forget worker (can take minutes; the poller is
        pull-image-progress). On failure it only reports (no auto-restore). Idempotent: replaying the
        same snapshot is harmless. #394 fast-path: when the target version dir is already fully installed
        on disk (a .complete marker present + all disks non-empty), pull SKIPS download/unzip and just
        flips the slots pointer (seconds) — this is how rollback works (pull an older, already-installed
        version to live with no re-download). A half-installed dir (interrupted/disk-full, no .complete
        marker) is treated as incomplete and re-downloaded (fail-safe: never flips onto a partial disk set).
