                  description: Hot-add vCPU on a RUNNING tenant. mem_mb live-resize is rejected (stop + recreate instead). vcpu must be an integer strictly greater than current (Firecracker cannot shrink).
                  x-source: deploy/lambda/api/services/tenant_service.py:1743
                  properties:
                    vcpu:
                      type: integer
                      description: New vCPU count, > current.
                    mem_mb:
                      type: integer
                      description: Always rejected with 400.
                - title: resize-disk
                  type: object
                  required:
                    - new_size_mb
                  description: Offline grow of data.ext4. Runs synchronously on the host; DDB size persisted only on success.
                  x-source: deploy/lambda/api/services/tenant_service.py:1230
                  properties:
                    new_size_mb:
                      type: integer
                      maximum: 1048576
                      description: Must be an integer, strictly larger than the current size (shrink not supported), and <= 1 TiB.
                - title: migrate
                  type: object
                  required:
                    - target_host_id
                  description: Async snapshot/restore migration (202). Rejected 409 when memory-overcommit balloon is enabled. Target must exist, differ from source, not be draining/deleted, and have capacity.
                  x-source: deploy/lambda/api/services/tenant_service.py:1285
                  properties:
                    target_host_id:
                      type: string
                - title: access
                  type: object
                  required:
                    - principal
                  description: Grant/revoke another Cognito sub's access. Owner access is implicit and cannot be modified here.
                  x-source: deploy/lambda/api/services/tenant_service.py:1677
                  properties:
                    principal:
                      type: string
                      description: Cognito sub.
                    op:
                      type: string
                      enum:
                        - grant
                        - revoke
