#
# AWS Distro for OpenTelemetry (ADOT) collector — scrapes the local
# host-agent /metrics endpoint and remote-writes to Amazon Managed
# Prometheus using SigV4 (no static credentials required).
#
# Deployed by init-host.sh as the systemd service `adot-collector`.
# Region and AMP workspace endpoint are templated in by init-host.sh.

extensions:
  sigv4auth:
    region: "${AWS_REGION}"
    service: "aps"

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "openclaw-host-agent"
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:9090"]
          relabel_configs:
            # Add the host instance ID as a label so we can group per-host
            - source_labels: [__address__]
              target_label: instance
              replacement: "${INSTANCE_ID}"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  prometheusremotewrite:
    endpoint: "${AMP_REMOTE_WRITE_URL}"
    auth:
      authenticator: sigv4auth
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite]
  telemetry:
    logs:
      level: info
