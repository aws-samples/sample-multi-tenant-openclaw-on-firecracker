openapi: 3.1.0
info:
  title: OpenClaw on Firecracker — 控制面 API(ClawPool 多租户平台)
  version: 1.6.0
  description: |-
    ClawPool 控制面 REST API(API Gateway + Lambda):租户 microVM 生命周期、宿主机/舰队、
    镜像槽位、技能/分组/模板、联邦与外部授权。实时聊天数据面不属于本 API。

    ## 在本页怎么试跑
    本页默认走**同域只读代理**(`/api/cp-proxy`):后端代持 x-api-key,浏览器**零输入**即可对 GET 接口
    点 Try it out 看真实返回;写操作(POST/PUT/DELETE)代理返回 405(公开页不做无鉴权写)。
    要真跑写操作或连自己的部署 → 用页面上方「高级」填 ApiUrl + x-api-key。

    ## 鉴权模型(直连真实控制面时)
    1. **API key**(`x-api-key` 头)—— 每个控制面调用都过 API Gateway usage-plan;缺/错 → 403。
    2. **Cognito JWT**(`Authorization: Bearer <id_token>`)—— 用户身份路由(如 `POST /tenants/self`),Lambda 内 JWKS RS256 验签。
    3. **RBAC + owner 门控** —— 角色 viewer < operator < admin(来自 cognito:groups);按租户的路由额外校验 owner==调用者(或 admin / api-key)。

    错误信封:较新的校验路径返回 `{"error","code"}`(code ∈ VALIDATION/CONFLICT/FORBIDDEN…);旧路径返回 `{"error"}`。
servers:
  - url: /api/cp-proxy
    description: 本页默认同域只读代理(后端代持 x-api-key,GET 零输入试跑;写操作 405)。直连真实控制面/跑写操作请用页面「高级」填 ApiUrl + x-api-key。
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: API Gateway usage-plan key. Required on every control-plane call.
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito id_token (RS256, JWKS-verified in Lambda).
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: string
      additionalProperties: true
    SharedSkillSync:
      type: object
      description: Host propagation dispatch summary. Accepted means SSM returned command ids, not that every host has completed the sync; the five-minute cron remains the fallback.
      required: [status, hosts]
      properties:
        status:
          type: string
          enum: [accepted, partial, dispatch_failed, no_active_hosts]
        hosts:
          type: integer
          minimum: 0
          description: Active/idle hosts selected.
        accepted_hosts:
          type: integer
          minimum: 0
          description: Hosts included in SSM batches that returned a command id.
        command_ids:
          type: array
          items:
            type: string
          description: One command id per accepted batch of at most 50 hosts.
        command_id:
          type: string
          description: Convenience alias present when exactly one batch was accepted.
    TenantRecord:
      type: object
      description: |
        A tenant record as returned by GET /tenants and GET /tenants/{id}. Secret fields (channel_secret, litellm_vkey, cognito_channel_password, gateway_token) are ALWAYS stripped by _redact_tenant before response. Field set verified against a live ap-southeast-1 response (2026-07-07).
      x-source: deploy/lambda/api/services/tenant_service.py:84 (_TENANT_SECRET_FIELDS redaction)
      properties:
        id:
          type: string
          description: Tenant id (name-hash or deterministic from client_token).
        name:
          type: string
        status:
          type: string
          description: creating | pending | queued | running | stopped | deleted | requires_intervention
        desired_status:
          type: string
          description: Reconciliation target status.
        owner_id:
          type: string
          description: Cognito sub or API_KEY_OWNER.
        tenant_user_id:
          type:
            - string
            - 'null'
          description: External-federation stable user id (from JWT custom claim).
        uuid:
          type: string
        vcpu:
          type: integer
        mem_mb:
          type: integer
        vm_num:
          type:
            - integer
            - 'null'
          description: Per-host VM slot number.
        host_id:
          type:
            - string
            - 'null'
          description: Instance id of the placing host; null while queued/pending.
        host_port:
          type:
            - integer
            - 'null'
        guest_ip:
          type:
            - string
            - 'null'
        image_id:
          type: string
        config_template:
          type:
            - string
            - 'null'
        tags:
          type: object
          additionalProperties:
            type: string
        vm_health:
          type:
            - string
            - 'null'
          description: up | down | unknown
        app_health:
          type:
            - string
            - 'null'
        health_failures:
          type:
            - integer
            - 'null'
        last_health_check:
          type:
            - string
            - 'null'
        metrics:
          type:
            - object
            - 'null'
        created_at:
          type:
            - string
            - 'null'
        creation_started_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
        last_backup_at:
          type:
            - string
            - 'null'
        restore_backup_key:
          type:
            - string
            - 'null'
        dispatch_claim:
          type:
            - string
            - 'null'
          description: Dispatch consumer claim token (internal).
        dispatch_claim_ts:
          type:
            - string
            - 'null'
        dispatch_retries:
          type:
            - integer
            - 'null'
        rebuild_op_id:
          type:
            - string
            - 'null'
          description: |
            ADR-rebuild-idempotency-sync-contract §5.3 — which rebuild operation the
            rebuild_* fields below describe. Compare with the op_id returned by
            POST /tenants/{id}/rebuild to confirm you are reading your own operation's
            progress rather than a concurrent one.
        rebuild_phase:
          type:
            - string
            - 'null'
          description: |
            How far the current asynchronous rebuild got: queued (worker accepted) →
            running (command dispatched to the host) → verifying (receipt in,
            checking adoption) → a terminal
            value matching rebuild_status (done | failed | unconfirmed).
            Additive field; absent on tenants that were never rebuilt.
        rebuild_started_at:
          type:
            - string
            - 'null'
          description: When the current rebuild started (ISO-8601).
        rebuild_status:
          type:
            - string
            - 'null'
          description: |
            Terminal verdict — done | failed | unconfirmed. On `unconfirmed` the control
            plane could not confirm this attempt's outcome (the rebuild may have
            succeeded). Do not submit a new rebuild operation while this one converges.
        rebuild_failed_reason:
          type:
            - string
            - 'null'
          description: Human-readable explanation accompanying failed / unconfirmed.
        rebuild_target_snapshot_time:
          type:
            - string
            - 'null'
          description: |
            The image snapshot this rebuild is upgrading to — the expected value that
            post-hoc reconciliation compares the host's actual running version against.
            Set when the selected channel resolves to a fixed canary version; absent
            for live, which resolves the host's current live slot at launch time.
        observed_image_snapshot_time:
          type:
            - string
            - 'null'
          description: |
            The image version the HOST reports this VM is actually running, refreshed
            by the host agent roughly every 15s from the tenant's on-host vm.json.
            ADR-rebuild-idempotency-sync-contract §5.4a path 2: comparing it with
            rebuild_target_snapshot_time lets a rebuild whose SSM receipt was lost be
            confirmed anyway. Best-effort audit value — usable as evidence of success,
            NOT as proof of failure (it records the version the launch intended to use,
            and the host writes it opportunistically). Absent on hosts using the legacy
            flat image layout, or on VMs last launched before the field existed.
    HostRecord:
      type: object
      description: |
        A Firecracker host record from GET /hosts. Field set verified against a live ap-southeast-1 response (2026-07-07).
      x-source: deploy/lambda/api/services/host_service.py:26
      properties:
        instance_id:
          type: string
        status:
          type: string
          description: active | draining
        az:
          type: string
        private_ip:
          type: string
        total_vcpu:
          type: integer
        used_vcpu:
          type: integer
        total_mem_mb:
          type: integer
        used_mem_mb:
          type: integer
        vm_count:
          type: integer
        next_vm_num:
          type: integer
        rootfs_version:
          type: string
        immutable_version:
          type: string
          description: '#517/#533 — read-only identity/authority-disk version staged on this host. POST /hosts/refresh-rootfs writes it from the host only after all requested disk operations succeed; absent when the manifest has no immutable disk or on older unknown rows.'
        is_tainted:
          type: boolean
          description: '#539 — cordon (NoSchedule) intent, orthogonal to status. Always present on the list response: the store only ever writes true and REMOVEs on untaint, so the response layer normalizes the "false / attribute-absent" pair to an explicit false. Only a real DynamoDB BOOL true counts as tainted (any other value fails open). Placement policy, not a cross-tenant security boundary. Owned exclusively by the taint API — self-register, POST /hosts, host-agent heartbeat, scaler and health_check must never create, overwrite or delete it.'
        tainted_at:
          type: integer
          description: '#539 — epoch seconds when the taint was recorded. Present only when is_tainted is true.'
        tainted_reason:
          type: string
          description: '#539 — operator-supplied non-empty reason. Present only when is_tainted is true. The tainted_by audit field is intentionally NOT surfaced on the list response.'
        cpu_overcommit_ratio:
          type:
            - string
            - number
        mem_overcommit_ratio:
          type:
            - string
            - number
        idle_since:
          type:
            - string
            - 'null'
        last_seen:
          type:
            - string
            - 'null'
        last_health_check:
          type:
            - string
            - 'null'
    FleetEgressRevision:
      description: |-
        一次 egress 变更落下的回滚锚点摘要(写路径的响应里返回这个形状)。两种形状互斥:
        版本写成功给完整摘要;只有 break-glass(`mode=off`)在版本写连续失败后仍继续下发,
        那一路返回退化形状 `{name: null, error}` —— 五个摘要字段一个都没有,所以不能用
        「required 全给上、name 允许 null」来表达,那会把真实响应判成不合规
        (`egress_admin_service.py:850`)。
      oneOf:
        - $ref: '#/components/schemas/FleetEgressRevisionRecorded'
        - $ref: '#/components/schemas/FleetEgressRevisionWriteFailed'
      x-source: deploy/lambda/api/services/egress_admin_service.py:831
    FleetEgressRevisionWriteFailed:
      type: object
      description: |-
        break-glass 专属退化形状:版本表连续写失败,但熔断必须继续,所以只回报「没落下锚点」
        与失败原因。**这次变更没有回滚锚点**,事后只能靠 GET /hosts/egress 的期望态自证。
      required:
        - name
        - error
      properties:
        name:
          type: 'null'
          description: 恒为 null —— 没有版本名可给。
        error:
          type: string
          description: 最后一次写失败的异常串。
      x-source: deploy/lambda/api/services/egress_admin_service.py:850
    FleetEgressRevisionRecorded:
      type: object
      description: 版本已落库的完整摘要。
      required:
        - name
        - auto_named
        - scope
        - hosts_recorded
        - kind
        - before_incomplete
      properties:
        name:
          type: string
          description: 版本名(DDB 主键去掉内部前缀后的部分)。
        auto_named:
          type: boolean
          description: true = 名字由服务端自动取(v<N>);false = 调用方显式指定。
        scope:
          type: string
          enum:
            - all
            - targeted
        hosts_recorded:
          type: integer
          minimum: 0
          description: before 里记下的 host 条数(不含 __fleet__ 快照)。
        kind:
          type: string
          enum:
            - apply
            - rollback
        before_incomplete:
          type: boolean
          description: |-
            true = 记录时读不到改动前的期望态(只有 break-glass 会这样)。这样的版本**不能**
            用于回滚,POST /hosts/egress/rollback 会对它返 409。
      x-source: deploy/lambda/api/services/egress_admin_service.py:831
    FleetEgressHostResult:
      type: object
      description: wait=true 时从 SSM 回收的逐机结果。
      properties:
        instance_id:
          type: string
        ssm_status:
          type: string
          description: SSM invocation 状态(Success / Failed / TimedOut / Cancelled / Undeliverable / Terminated)。
        apply_exit:
          type:
            - integer
            - 'null'
          description: host 上 apply/teardown 脚本的退出码;null = 输出里没解析到。
        rules_sha256:
          type:
            - string
            - 'null'
          description: 该 host 上 `iptables -S OPENCLAW-EGRESS` 的 sha256。跨机不相等是合法的(见 GET /hosts/egress 说明)。
        pinned_skip:
          type: boolean
          description: 这台因 egress_pinned 被本次全机队下发跳过。
        pin_check:
          type:
            - string
            - 'null'
          description: '`unavailable` 表示 host 侧无法确认 pin 状态 —— 它会把 wait=true 的整体结果压成 207。'
        command_id:
          type: string
          description: 仅 rollback 的逐机结果带此字段(回滚按分组下发,多条 command)。
      x-source: deploy/lambda/api/services/egress_admin_service.py:1279
    FleetEgressNoHosts:
      type: object
      description: wait=false 且枚举出 0 台可下发 host —— 期望态可能已写,但没有任何 SSM 下发。
      properties:
        mode:
          type: string
          enum:
            - deny
            - 'off'
        hosts:
          type: integer
          enum:
            - 0
        revision:
          $ref: '#/components/schemas/FleetEgressRevision'
        pin_enforced:
          type: boolean
        pinned_torn_down:
          type: array
          items:
            type: string
        pinned_skipped:
          type: array
          items:
            type: string
        unpinned_count:
          type: integer
        unpin_failed:
          type:
            - array
            - 'null'
          items:
            type: string
        extra_allow_cleared:
          type:
            - object
            - 'null'
          description: 省略 allow 而当前期望态确有放行洞时,列出被本次清空的洞(键 = instance_id 或 __fleet_egress_policy__)。
        desired_state_incomplete:
          type: boolean
        message:
          type: string
          enum:
            - no active hosts
      x-source: deploy/lambda/api/services/egress_admin_service.py:1537
    FleetEgressDispatched:
      type: object
      description: wait=false 的 202 —— 期望态已写、SSM 已下发,收敛异步发生。
      required:
        - mode
        - command_id
        - host_count
        - desired_state_scope
        - targeting
      properties:
        mode:
          type: string
          enum:
            - deny
            - 'off'
        revision:
          $ref: '#/components/schemas/FleetEgressRevision'
        command_id:
          type: string
          description: 这一次扇出的 SSM CommandId。
        host_count:
          type: integer
          minimum: 0
          description: 本次纳入的 host 数。全机队走 tag 扇出时它是枚举到的数量,不是 SSM 实际命中数。
        desired_state_written:
          type: integer
          description: 逐台写成功的 host 行数。targets="all" 时按设计恒为 0(只写 fleet 单例)。
        desired_state_incomplete:
          type: boolean
          description: |-
            仅定向路径可能为 true(desired_written != host_count)。为 true 时未写到的 host
            会被下一轮 host-agent reconcile 把链改回去,message 里也会带 WARNING。
        desired_state_scope:
          type: string
          enum:
            - fleet-singleton
            - per-instance
        pin_enforced:
          type: boolean
          description: 仅 targets="all" 且 mode!=off 时为 true —— 熔断必须穿透 pin,所以 off 不强制 pin。
        pinned_torn_down:
          type: array
          items:
            type: string
          description: 本次实际被拆链的 pinned 机器(仅熔断路径非空)。
        pinned_skipped:
          type: array
          items:
            type: string
          description: 本次被 pin 豁免而跳过的机器(pin_enforced=false 时恒为空)。
        unpinned_count:
          type: integer
        unpin_failed:
          type:
            - array
            - 'null'
          items:
            type: string
        extra_allow:
          type:
            - string
            - 'null'
          description: 本次写入的放行洞编码串(`proto:dport:cidr` 以逗号连接);无洞时 null。
        extra_allow_cleared:
          type:
            - object
            - 'null'
        extra_allow_scope:
          type:
            - object
            - 'null'
          description: |-
            本次放行洞的作用域回报(#668)。无洞时 null。`widest_prefix` 是最宽那条的
            前缀长度，`below_default_floor=true` 表示至少有一条比 /24 默认下界更宽 ——
            那时 message 里也会带一句 NOTE。这个字段只报事实，不改变任何状态码。
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  rule:
                    type: string
                  prefix:
                    type: integer
                  addresses:
                    type: integer
            widest_prefix:
              type: integer
            total_addresses:
              type: integer
            below_default_floor:
              type: boolean
            min_prefix:
              type: integer
        targeting:
          type: string
          enum:
            - tag:Role
            - instance-ids
          description: '`tag:Role` = 按 host 标签扇出(无 50 上限,含未来新机);`instance-ids` = 显式列表(≤50)。'
        message:
          type: string
      x-source: deploy/lambda/api/services/egress_admin_service.py:1597
    FleetEgressWaitResult:
      type: object
      description: wait=true 的结果(全绿 200,任一项失败或定向目标回收不全 207)。
      required:
        - ok
        - mode
        - command_id
        - hosts
        - consistent
      properties:
        ok:
          type: boolean
          description: 全部回收到的 host apply_exit=0 且 ssm_status=Success、没有 pin 检查不可用,且(定向路径)所有目标都回收到了结果。
        mode:
          type: string
          enum:
            - deny
            - 'off'
        revision:
          $ref: '#/components/schemas/FleetEgressRevision'
        command_id:
          type: string
        host_count:
          type: integer
          description: 这里是**回收到结果的**host 数(不是枚举数)。
        expected_host_count:
          type: integer
          description: |-
            本次下发的目标台数。`targets=[...]` 定向时 = 调用方给的 id 个数;`targets="all"`
            时 = 服务端 DDB 枚举出的 active/idle host 数(那是一份快照,可能含已终止或
            SSM 不受管的机器,也可能漏掉刚注册的新机)。与 `host_count` 一起看即可对账。
        missing_hosts:
          type:
            - array
            - 'null'
          items:
            type: string
          description: |-
            定向路径上**没有回收到 invocation** 的目标 instance id(升序)。它们的链状态未知 ——
            既不是成功也不是失败,只是这次窗口内没回来。`targets="all"` 时为 `null`:全量的
            期望集合是服务端枚举出来的快照,拿它算差集会把已终止的机器报成"缺失",所以不报。
        collection_incomplete:
          type: boolean
          description: |-
            定向路径上是否有目标没回收到结果(等价于 `missing_hosts` 非空)。为真时整体压成 207。
            `targets="all"` 恒为 false —— 全量不做数量判定(见 `missing_hosts` 的说明)。
        desired_state_written:
          type: integer
        desired_state_incomplete:
          type: boolean
        desired_state_scope:
          type: string
          enum:
            - fleet-singleton
            - per-instance
        pin_enforced:
          type: boolean
        pinned_torn_down:
          type: array
          items:
            type: string
        pinned_skipped:
          type: array
          items:
            type: string
        unpinned_count:
          type: integer
        unpin_failed:
          type:
            - array
            - 'null'
          items:
            type: string
        pin_check_unavailable:
          type: array
          items:
            type: string
          description: host 侧无法确认 pin 状态的机器。非空即把整体压成 207 —— 缺证据不算通过。
        extra_allow:
          type:
            - string
            - 'null'
        extra_allow_cleared:
          type:
            - object
            - 'null'
        extra_allow_scope:
          type:
            - object
            - 'null'
          description: |-
            本次放行洞的作用域回报(#668)。无洞时 null。`widest_prefix` 是最宽那条的
            前缀长度，`below_default_floor=true` 表示至少有一条比 /24 默认下界更宽 ——
            那时 message 里也会带一句 NOTE。这个字段只报事实，不改变任何状态码。
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  rule:
                    type: string
                  prefix:
                    type: integer
                  addresses:
                    type: integer
            widest_prefix:
              type: integer
            total_addresses:
              type: integer
            below_default_floor:
              type: boolean
            min_prefix:
              type: integer
        consistent:
          type: boolean
          description: |-
            = ok 且 rules_sha256 非 null。**没有任何真实指纹不算"一致"** —— 缺失证据不会被
            包装成没有问题。
        rules_sha256:
          type:
            - string
            - 'null'
          description: 全机指纹唯一时给出该值,否则 null。仅供取证,跨机不等不代表未收敛。
        rules_sha256_reason:
          type:
            - string
            - 'null'
          description: rules_sha256 为 null 的原因(无样本 / 多个不同值)。
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/FleetEgressHostResult'
        message:
          type: string
      x-source: deploy/lambda/api/services/egress_admin_service.py:1639
    FleetEgressAllowValidateResult:
      type: object
      description: POST /hosts/egress/allow/validate 的只读逐条 admission 结果。
      required:
        - verdict
        - allow_count
        - accepted_count
        - rejected_count
        - results
        - criteria
        - encoded_extra_allow
        - warnings
        - side_effects
        - message
      properties:
        verdict:
          type: string
          enum:
            - accept
            - reject
        allow_count:
          type: integer
          minimum: 0
          maximum: 64
        accepted_count:
