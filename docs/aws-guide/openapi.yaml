    post:
      operationId: submitRollingUpgrade
      summary: 提交有界、漂移门控的滚动镜像/身份升级
      description: |
        Creates an asynchronous rolling job. The target rootfs/immutable
        coordinates are frozen from each selected tenant's host live
        coordinates at submission time. The worker acts only on still-drifted
        tenants through the existing restart/rebuild action, waits for both
        coordinates after each batch, and stops when batch failures exceed
        max_batch_failures. Overlapping active scopes are rejected.
