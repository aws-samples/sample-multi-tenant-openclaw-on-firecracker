    post:
      operationId: tenantAction
      summary: Run a lifecycle / management action on a tenant
      description: >
        Dispatches on {action}. When the lifecycle SQS queue is enabled
        (LIFECYCLE_QUEUE_URL), start/stop/restart/pause/resume/reset/rebuild are
        enqueued and return 202 {status:queued}; otherwise they run synchronously
